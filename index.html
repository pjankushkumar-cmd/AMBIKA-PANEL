<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HACKII ULTRA AI DETECTOR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
padding:15px;
overflow-x:hidden;
}

.container{
max-width:520px;
margin:auto;
}

.title{
text-align:center;
font-size:34px;
font-weight:bold;
margin:20px 0;
color:#00ffd5;
text-shadow:
0 0 15px #00ffd5,
0 0 30px #00ffd5;
}

.box{
background:#0d0d0d;
border:1px solid #222;
padding:18px;
border-radius:22px;
box-shadow:
0 0 20px rgba(0,255,180,0.15),
0 0 50px rgba(0,255,180,0.05);
}

.live{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
font-size:15px;
}

.status{
display:flex;
align-items:center;
gap:10px;
}

.dot{
width:14px;
height:14px;
background:#00ff00;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{

50%{
opacity:0.3;
}

}

.bar{
width:100%;
height:18px;
background:#222;
border-radius:50px;
overflow:hidden;
margin-bottom:25px;
}

.style{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#00ff99,
#00ccff
);
transition:1s;
}

.result{
text-align:center;
margin-top:20px;
}

.result p{
font-size:20px;
opacity:0.8;
margin-bottom:20px;
}

.result h1{
font-size:75px;
margin-bottom:10px;
}

.result h2{
font-size:38px;
color:#00ffd5;
}

#analysis{
margin-top:25px;
font-size:15px;
line-height:1.9;
word-break:break-word;
}

.footer{
text-align:center;
margin-top:25px;
font-size:13px;
opacity:0.7;
}

.good{
color:#00ff99;
}

.bad{
color:red;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
HACKII ULTRA AI DETECTOR
</div>

<div class="box">

<div class="live">

<div class="status">

<div class="dot"></div>

<div id="server">
CONNECTING AI SERVERS...
</div>

</div>

<div id="time">
00:00:00
</div>

</div>

<div class="bar">
<div class="style"></div>
</div>

<div class="result">

<p>
ULTRA AI DETECTED RESULT
</p>

<h1 id="predict">
--
</h1>

<h2 id="number">
--
</h2>

</div>

<div id="analysis">

LOADING HIGH LEVEL AI...

</div>

</div>

<div class="footer">

POWERED BY HACKII QUANTUM AI ENGINE

</div>

</div>

<script>

// =====================================
// MAIN API
// =====================================

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

// =====================================
// GLOBAL MEMORY
// RESULT WILL NOT CHANGE ON REFRESH
// =====================================

let savedResult =
localStorage.getItem("hackii_result");

let savedNumber =
localStorage.getItem("hackii_number");

let savedPeriod =
localStorage.getItem("hackii_period");

// =====================================
// LIVE CLOCK
// =====================================

function startTimer(){

setInterval(()=>{

const now = new Date();

document.getElementById("time")
.innerHTML =
now.toLocaleTimeString();

},1000);

}

// =====================================
// COLOR SYSTEM
// =====================================

function getColor(num){

if(num == 0){

return "🟣";

}

if(num >= 1 && num <= 4){

return "🔴";

}

return "🟢";

}

// =====================================
// SIZE SYSTEM
// =====================================

function getSize(num){

if(num >= 5){

return "BIG";

}

return "SMALL";

}

// =====================================
// HIGH LEVEL AI ENGINE
// =====================================

async function load(){

try{

// =====================================
// FETCH LIVE DATA
// =====================================

const res = await fetch(
API + "?t=" + Date.now()
);

const json = await res.json();

const arr =
json?.data?.list || [];

if(arr.length == 0){

throw new Error("NO DATA");

}

// =====================================
// CURRENT PERIOD
// =====================================

const currentPeriod =
arr[0].issueNumber || arr[0].issue;

// =====================================
// IF SAME PERIOD
// DON'T CHANGE RESULT
// =====================================

if(savedPeriod == currentPeriod){

document.getElementById("predict")
.innerHTML =
savedResult;

document.getElementById("number")
.innerHTML =
"🎯 " + savedNumber;

document.getElementById("server")
.innerHTML =
"ALL AI SERVERS CONNECTED";

document.querySelector(".style")
.style.width = "96%";

document.getElementById("analysis")
.innerHTML = `

<b class="good">
✅ SAME PERIOD DETECTED
</b>

<br><br>

🧠 RESULT LOCK ACTIVE

<br><br>

🎯 FINAL RESULT:
${savedResult}
${savedNumber}

<br><br>

⚡ HIGH LEVEL AI ACTIVE

`;

return;

}

// =====================================
// GET LAST 100 RESULTS
// =====================================

const nums = arr
.slice(0,100)
.map(x =>
parseInt(x.number)
);

// =====================================
// ADVANCED AI VARIABLES
// =====================================

let red = 0;
let green = 0;
let violet = 0;

let big = 0;
let small = 0;

let repeat = 0;
let switchs = 0;

let streakRed = 0;
let streakGreen = 0;

let transitions = {};

let pairMemory = {};

let predict = {

"🔴":0,
"🟢":0,
"🟣":0

};

// =====================================
// FULL AI PATTERN DETECT
// =====================================

for(let i=0;i<nums.length-1;i++){

let current = nums[i];
let next = nums[i+1];

let c1 = getColor(current);
let c2 = getColor(next);

// =====================================
// COLOR COUNT
// =====================================

if(c1 == "🔴") red++;
if(c1 == "🟢") green++;
if(c1 == "🟣") violet++;

// =====================================
// BIG SMALL COUNT
// =====================================

if(getSize(current) == "BIG"){

big++;

}else{

small++;

}

// =====================================
// TRANSITION MEMORY
// =====================================

if(!transitions[c1]){

transitions[c1] = {};

}

if(!transitions[c1][c2]){

transitions[c1][c2] = 0;

}

transitions[c1][c2]++;

// =====================================
// PAIR MEMORY AI
// =====================================

let pair =
current + "-" + next;

if(!pairMemory[pair]){

pairMemory[pair] = 0;

}

pairMemory[pair]++;

// =====================================
// REPEAT AI
// =====================================

if(c1 == c2){

repeat++;

}else{

switchs++;

}

// =====================================
// STREAK AI
// =====================================

if(c1 == "🔴" &&
c2 == "🔴"){

streakRed++;

}

if(c1 == "🟢" &&
c2 == "🟢"){

streakGreen++;

}

}

// =====================================
// LAST RESULT
// =====================================

const last =
nums[0];

const lastColor =
getColor(last);

// =====================================
// TRANSITION AI
// =====================================

if(transitions[lastColor]){

for(let key in
transitions[lastColor]){

predict[key] +=
transitions[lastColor][key] * 9;

}

}

// =====================================
// TREND BREAK AI
// =====================================

if(red > green){

predict["🟢"] += 25;

}else{

predict["🔴"] += 25;

}

// =====================================
// STREAK BREAK AI
// =====================================

if(streakRed >= 2){

predict["🟢"] += 30;

}

if(streakGreen >= 2){

predict["🔴"] += 30;

}

// =====================================
// REPEAT BREAK ENGINE
// =====================================

if(repeat > switchs){

if(lastColor == "🔴"){

predict["🟢"] += 20;

}

if(lastColor == "🟢"){

predict["🔴"] += 20;

}

}

// =====================================
// PAIR MEMORY BOOST
// =====================================

for(let key in pairMemory){

if(pairMemory[key] >= 2){

if(key.includes("1-2")){

predict["🔴"] += 5;

}

if(key.includes("7-8")){

predict["🟢"] += 5;

}

}

}

// =====================================
// FINAL AI RESULT
// =====================================

let nextType = "🔴";

let max = 0;

for(let key in predict){

if(predict[key] > max){

max = predict[key];
nextType = key;

}

}

// =====================================
// NUMBER PICK
// =====================================

let nextNumber = 0;

if(nextType == "🔴"){

const reds =
[1,2,3,4];

nextNumber =
reds[Math.floor(
Math.random()*reds.length
)];

}

if(nextType == "🟢"){

const greens =
[5,6,7,8,9];

nextNumber =
greens[Math.floor(
Math.random()*greens.length
)];

}

if(nextType == "🟣"){

nextNumber = 0;

}

// =====================================
// SAVE RESULT
// =====================================

localStorage.setItem(
"hackii_result",
nextType
);

localStorage.setItem(
"hackii_number",
nextNumber
);

localStorage.setItem(
"hackii_period",
currentPeriod
);

// =====================================
// CONFIDENCE
// =====================================

const confidence =
Math.min(
99,
Math.floor(max)
);

// =====================================
// UPDATE UI
// =====================================

document.getElementById("predict")
.innerHTML =
nextType;

document.getElementById("number")
.innerHTML =
"🎯 " + nextNumber;

document.querySelector(".style")
.style.width =
confidence + "%";

document.getElementById("server")
.innerHTML =
"ALL AI SERVERS CONNECTED";

// =====================================
// SIZE RESULT
// =====================================

const sizeResult =
getSize(nextNumber);

// =====================================
// ANALYSIS
// =====================================

document.getElementById("analysis")
.innerHTML = `

<b>🔥 LIVE FLOW:</b><br>
${nums.slice(0,30).join(" → ")}

<br><br>

<b>🧠 HIGH LEVEL AI DETECTED:</b><br><br>

${nextType}
🎯 ${nextNumber}
📊 ${sizeResult}

<br><br>

<b>⚡ ULTRA AI ENGINE:</b><br><br>

• Quantum Pattern Detection<br>
• Deep Transition Learning<br>
• Live Pair Memory AI<br>
• Repeat Break Engine<br>
• Dynamic Trend Scanner<br>
• Advanced Momentum AI<br>
• Streak Reverse System<br>
• Self Learning Probability<br>
• Big Small Analysis<br>
• Real Time Server Sync<br>
• Locked Result Protection<br>
• Refresh Stable Predictor<br>

<br>

<b>📈 LIVE STATS:</b><br><br>

🔴 RED = ${red}<br>
🟢 GREEN = ${green}<br>
🟣 VIOLET = ${violet}<br>
📊 BIG = ${big}<br>
📉 SMALL = ${small}<br>

<br>

<b>🎯 AI CONFIDENCE:</b>
${confidence}%

`;

}catch(err){

console.log(err);

document.getElementById("server")
.innerHTML =
"SERVER ERROR";

document.getElementById("analysis")
.innerHTML = `

<div class="bad">

❌ API ERROR / SERVER BLOCK

</div>

<br>

<div class="good">

CHECK INTERNET OR API

</div>

`;

}

}

// =====================================
// START SYSTEM
// =====================================

startTimer();

load();

// =====================================
// AUTO REFRESH EVERY 5 SEC
// RESULT WILL STAY SAME
// UNTIL NEW PERIOD COMES
// =====================================

setInterval(load,5000);

</script>

</body>
</html>
