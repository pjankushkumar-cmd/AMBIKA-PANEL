<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ULTIMATE AI ANALYZER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#17153d;
padding:10px;
color:white;
overflow-x:hidden;
}

.mainBox{
background:#221f67;
border-radius:24px;
padding:14px;
margin-bottom:15px;
}

.title{
text-align:center;
font-size:34px;
font-weight:bold;
line-height:1.1;
color:#bb92ff;
margin-bottom:20px;
}

.predictBox{
background:#342f8f;
border-radius:18px;
padding:18px;
text-align:center;
}

.predictTitle{
font-size:20px;
color:#e7e7ff;
margin-bottom:8px;
}

.period{
font-size:42px;
font-weight:bold;
margin-bottom:18px;
color:#ffffff;
}

.predictNum{
font-size:110px;
font-weight:bold;
line-height:1;
margin-bottom:12px;
}

.aiText{
font-size:20px;
line-height:1.5;
color:#ffd76a;
margin-top:10px;
}

.serverTime{
font-size:42px;
font-weight:bold;
color:#00ffd5;
margin-top:10px;
}

.countdown{
font-size:85px;
font-weight:bold;
color:#ffd54f;
margin-top:10px;
}

.tableBox{
background:#221f67;
border-radius:24px;
overflow:hidden;
}

.header{
background:#5750b4;
display:grid;
grid-template-columns:1.5fr .7fr .9fr .6fr;
padding:16px 10px;
font-size:17px;
font-weight:bold;
}

.row{
display:grid;
grid-template-columns:1.5fr .7fr .9fr .6fr;
padding:16px 10px;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.periodText{
font-size:19px;
font-weight:bold;
}

.number{
font-size:70px;
font-weight:bold;
text-align:center;
line-height:1;
}

.bs{
font-size:22px;
text-align:center;
}

.colorWrap{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
}

.dot{
width:16px;
height:16px;
border-radius:50%;
}

.red{
background:#ff4d5a;
box-shadow:0 0 10px #ff4d5a;
}

.green{
background:#00ff99;
box-shadow:0 0 10px #00ff99;
}

.violet{
background:#ff5cff;
box-shadow:0 0 10px #ff5cff;
}

.pagination{
background:#221f67;
margin-top:15px;
border-radius:24px;
padding:18px;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

.btn{
width:70px;
height:70px;
border:none;
border-radius:18px;
background:#8d7dff;
color:white;
font-size:42px;
cursor:pointer;
}

.page{
font-size:28px;
font-weight:bold;
}

.greenText{
color:#00ff99;
text-shadow:0 0 15px #00ff99;
}

.redText{
color:#ff5566;
text-shadow:0 0 15px #ff5566;
}

.loader{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

</style>

</head>

<body>

<div class="mainBox">

<div class="title">
ULTIMATE AI ANALYZER
</div>

<div class="predictBox">

<div class="predictTitle">
UPCOMING PERIOD
</div>

<div class="period"
id="upcomingPeriod">
0000
</div>

<div class="predictNum loader"
id="predictNum">
--
</div>

<div class="aiText"
id="aiText">
AI ANALYZING LIVE DATA...
</div>

<div style="
margin-top:25px;
font-size:22px;">
SERVER TIME
</div>

<div class="serverTime"
id="serverTime">
00:00:00
</div>

<div style="
margin-top:20px;
font-size:22px;">
NEXT REFRESH IN
</div>

<div class="countdown"
id="countdown">
60s
</div>

</div>

</div>

<div class="tableBox">

<div class="header">

<div>Period</div>

<div style="text-align:center;">
Number
</div>

<div style="text-align:center;">
Big Small
</div>

<div style="text-align:center;">
Color
</div>

</div>

<div id="historyRows"></div>

</div>

<div class="pagination">

<button class="btn"
onclick="prevPage()">
‹
</button>

<div class="page"
id="pageNo">
1/50
</div>

<button class="btn"
onclick="nextPage()">
›
</button>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let allHistory = [];
let batches = [];
let currentPage = 0;
let lastFetchedPeriod = "";

/* =========================
   KEEP SCREEN ACTIVE
========================= */

async function keepAwake(){

try{

if('wakeLock' in navigator){

await navigator.wakeLock.request('screen');

}

}catch(e){

console.log(e);

}

}

keepAwake();

/* =========================
   BIG SMALL
========================= */

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

/* =========================
   COLOR
========================= */

function getColor(n){

if([0,2,4,6,8].includes(n)){

return "red";

}

return "green";

}

/* =========================
   NUMBER COLOR
========================= */

function getNumberClass(n){

if([0,2,4,6,8].includes(n)){

return "redText";

}

return "greenText";

}

/* =========================
   MAKE 50 BATCH
========================= */

function makeBatches(data){

let temp = [];

for(let i=0;i<data.length;i+=10){

temp.push(
data.slice(i,i+10)
);

}

while(temp.length > 50){

temp.shift();

}

batches = temp;

}

/* =========================
   ADVANCED AI
========================= */

function advancedAI(){

let nums =
allHistory.map(x=>x.number);

let score = {};

for(let i=0;i<=9;i++){

score[i]=0;

}

let weight = 1;

for(let i=nums.length-1;i>=1;i--){

let current = nums[i];
let prev = nums[i-1];

score[current] += weight;

if(current === prev){

score[current] += 5;

}

if(getBigSmall(current)
=== getBigSmall(prev)){

score[current] += 2.5;

}

if(getColor(current)
=== getColor(prev)){

score[current] += 2.5;

}

weight += 0.12;

}

let best = 0;
let high = 0;

for(let n in score){

if(score[n] > high){

high = score[n];
best = Number(n);

}

}

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let conf =
Math.min(
95,
((high/total)*100+50)
).toFixed(1);

document.getElementById(
"predictNum"
).innerHTML = best;

document.getElementById(
"predictNum"
).className =

`predictNum ${getNumberClass(best)}`;

document.getElementById(
"aiText"
).innerHTML =

`AI DETECT:
${getBigSmall(best)}
 •
${getColor(best).toUpperCase()}
 •
${conf}% Confidence`;

}

/* =========================
   RENDER PAGE
========================= */

function renderPage(){

const box =
document.getElementById(
"historyRows"
);

box.innerHTML = "";

if(!batches[currentPage]) return;

let batch =
batches[currentPage];

batch.forEach(item=>{

let numberClass =
getNumberClass(item.number);

let dots = "";

if(item.number == 5){

dots = `
<div class="dot green"></div>
<div class="dot violet"></div>
`;

}else{

dots = `
<div class="dot ${getColor(item.number)}"></div>
`;

}

box.innerHTML += `

<div class="row">

<div class="periodText">

${item.shortPeriod}

</div>

<div class="number ${numberClass}">

${item.number}

</div>

<div class="bs">

${getBigSmall(item.number)}

</div>

<div class="colorWrap">

${dots}

</div>

</div>

`;

});

document.getElementById(
"pageNo"
).innerHTML =

`${currentPage+1}/50`;

}

/* =========================
   NEXT PAGE
========================= */

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

/* =========================
   PREV PAGE
========================= */

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length-1;

}

renderPage();

}

/* =========================
   LIVE CLOCK
========================= */

function startClock(){

setInterval(()=>{

const now = new Date();

const h =
String(now.getHours())
.padStart(2,"0");

const m =
String(now.getMinutes())
.padStart(2,"0");

const s =
String(now.getSeconds())
.padStart(2,"0");

document.getElementById(
"serverTime"
).innerHTML =

`${h}:${m}:${s}`;

/* REAL COUNTDOWN */

let remain =
60 - now.getSeconds();

document.getElementById(
"countdown"
).innerHTML =

remain + "s";

/* EXACT AUTO REFRESH */

if(now.getSeconds() === 0){

silentRefresh();

}

},1000);

}

/* =========================
   LIVE SERVER FETCH
========================= */

async function silentRefresh(){

try{

const res =
await fetch(
API + "?t=" + Date.now(),
{
cache:"no-store"
}
);

const data =
await res.json();

const list =
data.data.list || [];

list.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

/* SAME PERIOD CHECK */

if(
lastFetchedPeriod ===
list[0]?.issueNumber
){

return;

}

lastFetchedPeriod =
list[0]?.issueNumber;

/* SAVE HISTORY */

allHistory =
list.map(x=>({

issueNumber:
String(x.issueNumber),

shortPeriod:
String(x.issueNumber)
.slice(-4),

number:
Number(x.number)

}));

/* CREATE BATCHES */

makeBatches(allHistory);

/* RENDER */

renderPage();

advancedAI();

/* NEXT PERIOD */

let latest =
allHistory[0]
?.issueNumber || "0";

let nextPeriod =
String(
BigInt(latest)+1n
);

document.getElementById(
"upcomingPeriod"
).innerHTML =

nextPeriod.slice(-4);

}catch(e){

console.log(e);

}

}

/* =========================
   BACKGROUND AUTO
========================= */

setInterval(()=>{

silentRefresh();

},5000);

/* =========================
   TAB ACTIVE AUTO
========================= */

document.addEventListener(
"visibilitychange",
()=>{

if(!document.hidden){

silentRefresh();

}

}
);

/* =========================
   NETWORK ONLINE AUTO
========================= */

window.addEventListener(
"online",
()=>{

silentRefresh();

}
);

/* =========================
   START
========================= */

startClock();

silentRefresh();

</script>

</body>
</html>
