<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII AI LIVE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:15px;
overflow-x:hidden;
}

.container{
max-width:1100px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:42px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.center{
text-align:center;
}

.countdown{
font-size:65px;
font-weight:bold;
color:#00ff99;
margin-top:10px;
}

.predict{
font-size:60px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:110px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.conf{
font-size:28px;
margin-top:10px;
}

.signal{
margin-top:15px;
font-size:24px;
}

.bar{
height:10px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:15px;
border-radius:15px;
line-height:32px;
font-size:17px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
font-size:17px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII AI LIVE</h1>
<p>REAL TIME AI + COUNTDOWN DETECTOR</p>
</div>

<div class="card center">

<h2>⏳ NEXT ROUND COUNTDOWN</h2>

<div class="countdown" id="timer">
00:00
</div>

</div>

<div class="card center">

<h2>🔮 UPCOMING AI DETECTION</h2>

<div class="predict" id="predictType">
ANALYZING...
</div>

<div class="number" id="predictNumber">
--
</div>

<div class="conf" id="confidence">
Confidence : 0%
</div>

<div class="signal" id="signal">
READING LIVE PATTERN...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading AI Analysis...
</div>

</div>

<div class="card">

<h2>📊 LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII QUANTUM ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

function getColor(num){

if([0,2,4,6,8].includes(num)){
return "RED";
}

return "GREEN";

}

function startTimer(){

function update(){

let now = new Date();

let sec = now.getSeconds();

let remain = 60 - sec;

if(remain == 60){
remain = 0;
}

let min = Math.floor(remain/60);
let seconds = remain % 60;

document.getElementById("timer").innerHTML =
String(min).padStart(2,'0') +
":" +
String(seconds).padStart(2,'0');

}

update();

setInterval(update,1000);

}

async function loadData(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runAI(list);

}catch(err){

document.getElementById("predictType").innerHTML =
"API ERROR";

}

}

function renderHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,15).forEach(item=>{

let num = Number(item.number);

let color = getColor(num);

let type = num >=5 ? "BIG":"SMALL";

let cls =
color=="RED"
? "red"
: "green";

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

function runAI(list){

let nums = [];

list.slice(0,15).forEach(item=>{

nums.push(Number(item.number));

});

let scores = {};

for(let i=0;i<=9;i++){
scores[i]=0;
}

let last = nums[0];

let transitions = {};

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(!transitions[current]){
transitions[current]={};
}

if(!transitions[current][next]){
transitions[current][next]=0;
}

transitions[current][next]++;

}

for(let n=0;n<=9;n++){

for(let i=0;i<nums.length;i++){

let current = nums[i];

let diff = Math.abs(current-n);

scores[n] += (10-diff);

if(n%2 == current%2){
scores[n]+=5;
}

if(
(n>=5 && current>=5) ||
(n<5 && current<5)
){
scores[n]+=7;
}

if(Math.abs(current-n)<=1){
scores[n]+=9;
}

}

if(transitions[last] &&
transitions[last][n]){

scores[n] +=
transitions[last][n]*20;

}

if(nums.includes(n)){
scores[n]-=12;
}

}

let predicted = Number(
Object.keys(scores).reduce((a,b)=>
scores[a]>scores[b]?a:b
));

let type =
predicted>=5
? "🔴 BIG"
: "🟢 SMALL";

let color = getColor(predicted);

let cls =
color=="RED"
? "red"
: "green";

let confidence = 80;

let bigCount =
nums.filter(n=>n>=5).length;

let smallCount =
nums.filter(n=>n<5).length;

if(predicted>=5 && bigCount>smallCount){
confidence+=7;
}

if(predicted<5 && smallCount>bigCount){
confidence+=7;
}

let odd =
nums.filter(n=>n%2!=0).length;

let even =
nums.filter(n=>n%2==0).length;

if(predicted%2==0 && even>odd){
confidence+=5;
}

if(predicted%2!=0 && odd>even){
confidence+=5;
}

if(Math.abs(last-predicted)<=2){
confidence+=6;
}

if(transitions[last] &&
transitions[last][predicted]){
confidence +=
transitions[last][predicted]*4;
}

if(confidence>98){
confidence=98;
}

let signal = "NORMAL AI SIGNAL";

if(confidence>=92){

signal="ULTRA HIGH SIGNAL";

}else if(confidence>=85){

signal="STRONG LIVE SIGNAL";

}

document.getElementById("predictType").innerHTML =
type;

document.getElementById("predictNumber").innerHTML =
predicted;

document.getElementById("predictNumber").className =
"number "+cls;

document.getElementById("confidence").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("signal").innerHTML =
signal;

document.getElementById("fill").style.width =
confidence+"%";

document.getElementById("analysis").innerHTML = `

<b>Upcoming Number:</b>
<span class="${cls}">
${predicted}
</span><br><br>

<b>Upcoming Color:</b>
<span class="${cls}">
${color}
</span><br><br>

<b>Upcoming Type:</b>
${type}<br><br>

<b>AI Detection Engine:</b><br>
• Transition Mapping<br>
• Repeat Break Scan<br>
• Odd/Even Detection<br>
• Big/Small Pressure<br>
• Distance Matching<br>
• Live Heatmap Reading<br>
• Momentum Tracking<br>
• Upcoming Trend Analysis<br><br>

<b>Last Numbers:</b><br>
${nums.join(" → ")}

`;

}

startTimer();

loadData();

setInterval(loadData,2000);

</script>

</body>
</html>
