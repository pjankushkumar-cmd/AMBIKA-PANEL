<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HACKII AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#16153d;
padding:10px;
color:white;
overflow-x:hidden;
}

.main{
max-width:700px;
margin:auto;
}

.top{
background:#221f67;
border-radius:24px;
padding:16px;
margin-bottom:15px;
box-shadow:0 0 25px rgba(0,0,0,.35);
}

.title{
font-size:34px;
font-weight:bold;
text-align:center;
color:#d7b5ff;
margin-bottom:20px;
}

.predictBox{
background:#342f8f;
padding:18px;
border-radius:20px;
text-align:center;
}

.smallTitle{
font-size:18px;
color:#ddd;
}

.period{
font-size:56px;
font-weight:bold;
margin-top:10px;
color:#fff;
}

.predict{
font-size:130px;
font-weight:bold;
line-height:1;
margin-top:10px;
transition:.3s;
min-height:130px;
display:flex;
justify-content:center;
align-items:center;
}

.redText{
color:#ff4d5f;
text-shadow:0 0 18px #ff4d5f;
}

.greenText{
color:#00ff9d;
text-shadow:0 0 18px #00ff9d;
}

.ai{
font-size:18px;
color:#ffd86a;
margin-top:18px;
line-height:1.7;
}

.status{
font-size:15px;
margin-top:12px;
color:#8cffb2;
}

.time{
margin-top:25px;
font-size:20px;
}

.clock{
font-size:42px;
font-weight:bold;
color:#00ffe5;
margin-top:10px;
}

.count{
font-size:85px;
font-weight:bold;
color:#ffd54f;
margin-top:10px;
}

.table{
background:#221f67;
border-radius:24px;
overflow:hidden;
margin-top:15px;
}

.header{
background:#5d56bf;
display:grid;
grid-template-columns:1.4fr .7fr .9fr .6fr;
padding:16px 10px;
font-size:16px;
font-weight:bold;
}

.row{
display:grid;
grid-template-columns:1.4fr .7fr .9fr .6fr;
padding:14px 10px;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.06);
}

.periodText{
font-size:16px;
font-weight:bold;
}

.num{
font-size:58px;
font-weight:bold;
text-align:center;
}

.bs{
font-size:18px;
text-align:center;
}

.colorWrap{
display:flex;
justify-content:center;
align-items:center;
}

.dot{
width:16px;
height:16px;
border-radius:50%;
}

.red{
background:#ff4d5f;
box-shadow:0 0 10px #ff4d5f;
}

.green{
background:#00ff9d;
box-shadow:0 0 10px #00ff9d;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
background:#221f67;
padding:18px;
border-radius:24px;
margin-top:15px;
}

.btn{
width:65px;
height:65px;
border:none;
border-radius:18px;
background:#8f7dff;
color:white;
font-size:38px;
cursor:pointer;
}

.page{
font-size:24px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="main">

<div class="top">

<div class="title">
HACKII AI
</div>

<div class="predictBox">

<div class="smallTitle">
UPCOMING PERIOD
</div>

<div class="period"
id="upcomingPeriod">
0000
</div>

<div class="predict"
id="predictNum">
0
</div>

<div class="ai"
id="aiText">
LIVE AI ANALYZING...
</div>

<div class="status"
id="status">
LIVE SERVER CONNECTED
</div>

<div class="time">
SERVER TIME
</div>

<div class="clock"
id="clock">
00:00:00
</div>

<div class="time">
NEXT UPDATE IN
</div>

<div class="count"
id="countdown">
60s
</div>

</div>

</div>

<div class="table">

<div class="header">

<div>Period</div>
<div style="text-align:center;">Number</div>
<div style="text-align:center;">Big/Small</div>
<div style="text-align:center;">Color</div>

</div>

<div id="history"></div>

</div>

<div class="pagination">

<button class="btn"
onclick="prevPage()">
‹
</button>

<div class="page"
id="pageNo">
1/50
</div>

<button class="btn"
onclick="nextPage()">
›
</button>

</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let memoryStore = [];
let batches = [];
let currentPage = 0;
let fetching = false;

/* HELPERS */

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

function getColor(n){

return [0,2,4,6,8]
.includes(n)
? "red"
: "green";

}

function getClass(n){

return [0,2,4,6,8]
.includes(n)
? "redText"
: "greenText";

}

/* MEMORY */

function updateMemory(data){

data.forEach(item=>{

let exists =
memoryStore.find(x=>
x.issueNumber ===
item.issueNumber
);

if(!exists){

memoryStore.unshift(item);

}

});

memoryStore.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

memoryStore =
memoryStore.slice(0,500);

}

/* BATCHES */

function makeBatches(){

batches = [];

for(let i=0;i<500;i+=10){

let batch =
memoryStore.slice(i,i+10);

if(batch.length){

batches.push(batch);

}

}

}

/* AI ENGINE */

function advancedAI(){

if(memoryStore.length < 10){

document.getElementById(
"predictNum"
).innerHTML = "?";

return;

}

let nums =
memoryStore.map(x=>
Number(x.number)
);

nums = nums.filter(x=>
!isNaN(x)
);

let score = {};
let transitions = {};

for(let i=0;i<=9;i++){

score[i]=1;

}

/* FREQUENCY */

nums.forEach(n=>{

score[n]+=2;

});

/* RECENT */

let weight = 20;

for(let i=0;i<nums.length;i++){

score[nums[i]] += weight;

weight -= 0.3;

if(weight < 1){

weight = 1;

}

}

/* TRANSITIONS */

for(let i=0;i<nums.length-1;i++){

let current = nums[i];
let next = nums[i+1];

if(!transitions[current]){

transitions[current] = {};

}

if(!transitions[current][next]){

transitions[current][next] = 0;

}

transitions[current][next]++;

}

/* LAST FLOW */

let last = nums[0];

if(transitions[last]){

for(let n in transitions[last]){

score[n] +=
transitions[last][n] * 15;

}

}

/* REPEAT */

for(let i=1;i<nums.length;i++){

if(nums[i]===nums[i-1]){

score[nums[i]] += 8;

}

}

/* GAP */

for(let i=2;i<nums.length;i++){

if(nums[i]===nums[i-2]){

score[nums[i]] += 5;

}

}

/* HOT */

for(let i=0;i<15;i++){

if(nums[i]!==undefined){

score[nums[i]] += 5;

}

}

/* ANTI SAME */

score[last] *= 0.10;

/* FINAL */

let sorted =
Object.entries(score)
.sort((a,b)=>b[1]-a[1]);

let best =
Number(sorted[0][0]);

let second =
Number(sorted[1][0]);

let third =
Number(sorted[2][0]);

if(isNaN(best)){

best = 0;

}

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let p1 =
((score[best]/total)*100)
.toFixed(1);

let p2 =
((score[second]/total)*100)
.toFixed(1);

let p3 =
((score[third]/total)*100)
.toFixed(1);

/* UI */

document.getElementById(
"predictNum"
).innerHTML = best;

document.getElementById(
"predictNum"
).className =

`predict ${getClass(best)}`;

document.getElementById(
"aiText"
).innerHTML =

`
TOP AI TREND<br><br>

${best} → ${p1}%<br>
${second} → ${p2}%<br>
${third} → ${p3}%<br><br>

${getBigSmall(best)}
 •
${getColor(best).toUpperCase()}
`;

}

/* RENDER */

function renderPage(){

const box =
document.getElementById(
"history"
);

box.innerHTML = "";

if(!batches[currentPage]) return;

batches[currentPage]
.forEach(item=>{

box.innerHTML += `

<div class="row">

<div class="periodText">
${item.shortPeriod}
</div>

<div class="num ${getClass(item.number)}">
${item.number}
</div>

<div class="bs">
${getBigSmall(item.number)}
</div>

<div class="colorWrap">
<div class="dot ${getColor(item.number)}"></div>
</div>

</div>

`;

});

document.getElementById(
"pageNo"
).innerHTML =

`${currentPage+1}/${batches.length}`;

}

/* PAGES */

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length - 1;

}

renderPage();

}

/* CLOCK */

function startClock(){

setInterval(()=>{

const now = new Date();

const h =
String(now.getHours())
.padStart(2,"0");

const m =
String(now.getMinutes())
.padStart(2,"0");

const s =
String(now.getSeconds())
.padStart(2,"0");

document.getElementById(
"clock"
).innerHTML =

`${h}:${m}:${s}`;

let remain =
60 - now.getSeconds();

if(remain === 60){

remain = 0;

}

document.getElementById(
"countdown"
).innerHTML =

remain + "s";

},1000);

}

/* FETCH */

async function fetchData(){

if(fetching) return;

fetching = true;

try{

const res =
await fetch(
API + "?t=" + Date.now(),
{
cache:"no-store"
}
);

const json =
await res.json();

let list =
json?.data?.list || [];

if(!list.length){

fetching = false;
return;

}

list.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

/* CURRENT */

let latestIssue =
String(list[0].issueNumber)
.trim();

/* NEXT */

let nextIssue =
(
BigInt(latestIssue)
+ 1n
).toString();

/* UPCOMING FIX */

document.getElementById(
"upcomingPeriod"
).innerHTML =

nextIssue.slice(-4);

/* FORMAT */

let formatted =
list.map(x=>({

issueNumber:
String(x.issueNumber),

shortPeriod:
String(x.issueNumber)
.slice(-4),

number:
Number(x.number)

}));

updateMemory(formatted);

makeBatches();

renderPage();

advancedAI();

document.getElementById(
"status"
).innerHTML =

"LIVE SERVER CONNECTED";

fetching = false;

}catch(e){

console.log(e);

fetching = false;

document.getElementById(
"status"
).innerHTML =

"SERVER RECONNECTING...";

}

}

/* AUTO */

async function autoLoop(){

await fetchData();

setTimeout(autoLoop,2000);

}

autoLoop();

/* TAB */

document.addEventListener(
"visibilitychange",
()=>{

if(!document.hidden){

fetchData();

}

});

/* NETWORK */

window.addEventListener(
"online",
()=>{

fetchData();

});

/* START */

startClock();

</script>

</body>
</html>
