<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HACKII AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#16153d;
padding:10px;
color:white;
overflow-x:hidden;
}

.main{
max-width:700px;
margin:auto;
}

.top{
background:#221f67;
border-radius:24px;
padding:16px;
margin-bottom:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.title{
font-size:34px;
font-weight:bold;
text-align:center;
color:#d3b0ff;
margin-bottom:20px;
}

.predictBox{
background:#342f8f;
padding:18px;
border-radius:20px;
text-align:center;
}

.smallTitle{
font-size:18px;
color:#eee;
}

.period{
font-size:48px;
font-weight:bold;
margin-top:10px;
}

.predict{
font-size:130px;
font-weight:bold;
margin-top:10px;
transition:.3s;
line-height:1;
}

.redText{
color:#ff4d5f;
text-shadow:0 0 18px #ff4d5f;
}

.greenText{
color:#00ff9d;
text-shadow:0 0 18px #00ff9d;
}

.ai{
font-size:20px;
color:#ffd86a;
margin-top:15px;
line-height:1.6;
}

.time{
margin-top:25px;
font-size:20px;
}

.clock{
font-size:40px;
font-weight:bold;
color:#00ffe5;
margin-top:10px;
}

.count{
font-size:80px;
font-weight:bold;
color:#ffd54f;
margin-top:10px;
}

.table{
background:#221f67;
border-radius:24px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.header{
background:#5d56bf;
display:grid;
grid-template-columns:1.4fr .7fr .9fr .6fr;
padding:16px 10px;
font-size:16px;
font-weight:bold;
}

.row{
display:grid;
grid-template-columns:1.4fr .7fr .9fr .6fr;
padding:14px 10px;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.06);
}

.periodText{
font-size:16px;
font-weight:bold;
}

.num{
font-size:58px;
font-weight:bold;
text-align:center;
}

.bs{
font-size:18px;
text-align:center;
}

.colorWrap{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
}

.dot{
width:16px;
height:16px;
border-radius:50%;
}

.red{
background:#ff4d5f;
box-shadow:0 0 10px #ff4d5f;
}

.green{
background:#00ff9d;
box-shadow:0 0 10px #00ff9d;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
background:#221f67;
padding:18px;
border-radius:24px;
margin-top:15px;
}

.btn{
width:65px;
height:65px;
border:none;
border-radius:18px;
background:#8f7dff;
color:white;
font-size:38px;
cursor:pointer;
}

.page{
font-size:24px;
font-weight:bold;
}

.status{
margin-top:12px;
font-size:15px;
color:#8cffb2;
}

.loader{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="main">

<div class="top">

<div class="title">
HACKII AI
</div>

<div class="predictBox">

<div class="smallTitle">
UPCOMING PERIOD
</div>

<div class="period"
id="upcomingPeriod">
0000
</div>

<div class="predict loader"
id="predictNum">
--
</div>

<div class="ai"
id="aiText">
ULTRA AI ANALYZING LIVE TREND...
</div>

<div class="status"
id="status">
LIVE SERVER CONNECTED
</div>

<div class="time">
SERVER TIME
</div>

<div class="clock"
id="clock">
00:00:00
</div>

<div class="time">
NEXT UPDATE IN
</div>

<div class="count"
id="countdown">
60s
</div>

</div>

</div>

<div class="table">

<div class="header">

<div>Period</div>
<div style="text-align:center;">Number</div>
<div style="text-align:center;">Big/Small</div>
<div style="text-align:center;">Color</div>

</div>

<div id="history"></div>

</div>

<div class="pagination">

<button class="btn"
onclick="prevPage()">
‹
</button>

<div class="page"
id="pageNo">
1/50
</div>

<button class="btn"
onclick="nextPage()">
›
</button>

</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let memoryStore = [];
let batches = [];
let currentPage = 0;
let lastPeriod = "";

/* =========================
   KEEP SCREEN ACTIVE
========================= */

async function keepAwake(){

try{

if("wakeLock" in navigator){

await navigator.wakeLock.request("screen");

}

}catch(e){}

}

keepAwake();

/* =========================
   HELPERS
========================= */

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

function getColor(n){

return [0,2,4,6,8]
.includes(n)
? "red"
: "green";

}

function getClass(n){

return [0,2,4,6,8]
.includes(n)
? "redText"
: "greenText";

}

/* =========================
   MEMORY SYSTEM
========================= */

function updateMemory(data){

data.forEach(item=>{

let exists =
memoryStore.find(x=>
x.issueNumber ===
item.issueNumber
);

if(!exists){

memoryStore.unshift(item);

}

});

memoryStore.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

memoryStore =
memoryStore.slice(0,500);

}

/* =========================
   50 BATCH
========================= */

function makeBatches(){

batches = [];

for(let i=0;i<500;i+=10){

let batch =
memoryStore.slice(i,i+10);

if(batch.length){

batches.push(batch);

}

}

}

/* =========================
   ULTRA AI
========================= */

function advancedAI(){

if(memoryStore.length < 50){

document.getElementById(
"predictNum"
).innerHTML = "--";

return;

}

let nums =
memoryStore.map(x=>x.number);

let score = {};

for(let i=0;i<=9;i++){

score[i] = 0;

}

/* TRANSITIONS */

let transitions = {};

for(let i=0;i<nums.length-1;i++){

let a = nums[i];
let b = nums[i+1];

if(!transitions[a]){

transitions[a] = {};

}

if(!transitions[a][b]){

transitions[a][b] = 0;

}

transitions[a][b]++;

}

/* RECENT */

let w = 1;

for(let i=nums.length-1;i>=0;i--){

score[nums[i]] += w;

w += 0.14;

}

/* HOT */

for(let i=0;i<20;i++){

if(nums[i] !== undefined){

score[nums[i]] += 5;

}

}

/* REPEAT */

for(let i=1;i<nums.length;i++){

if(nums[i] === nums[i-1]){

score[nums[i]] += 7;

}

}

/* REVERSE */

for(let i=2;i<nums.length;i++){

if(nums[i] === nums[i-2]){

score[nums[i]] += 4;

}

}

/* BOUNCE */

for(let i=3;i<nums.length;i++){

if(nums[i] === nums[i-3]){

score[nums[i]] += 3;

}

}

/* LAST FLOW */

let last =
nums[0];

if(transitions[last]){

for(let n in transitions[last]){

score[n] +=
transitions[last][n] * 16;

}

}

/* BIG SMALL */

let big =
nums.filter(x=>x>=5).length;

let small =
nums.filter(x=>x<=4).length;

if(big > small){

for(let i=0;i<=4;i++){

score[i] += 8;

}

}else{

for(let i=5;i<=9;i++){

score[i] += 8;

}

}

/* COLOR */

let red =
nums.filter(x=>
[0,2,4,6,8]
.includes(x)
).length;

let green =
nums.length - red;

if(red > green){

[1,3,5,7,9]
.forEach(n=>{

score[n] += 6;

});

}else{

[0,2,4,6,8]
.forEach(n=>{

score[n] += 6;

});

}

/* ANTI SAME */

score[last] *= 0.08;

/* FINAL */

let sorted =
Object.entries(score)
.sort((a,b)=>b[1]-a[1]);

let best =
Number(sorted[0][0]);

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let conf =
Math.min(
98,
(
(score[best]/total)*100
+ 50
).toFixed(1)
);

/* UPDATE UI */

document.getElementById(
"predictNum"
).innerHTML = best;

document.getElementById(
"predictNum"
).className =

`predict ${getClass(best)}`;

document.getElementById(
"aiText"
).innerHTML =

`HACKII AI DETECT:
${getBigSmall(best)}
 •
${getColor(best).toUpperCase()}
 •
${conf}% Confidence`;

}

/* =========================
   RENDER
========================= */

function renderPage(){

const box =
document.getElementById(
"history"
);

box.innerHTML = "";

if(!batches[currentPage])
return;

batches[currentPage]
.forEach(item=>{

box.innerHTML += `

<div class="row">

<div class="periodText">

${item.shortPeriod}

</div>

<div class="num ${getClass(item.number)}">

${item.number}

</div>

<div class="bs">

${getBigSmall(item.number)}

</div>

<div class="colorWrap">

<div class="dot ${getColor(item.number)}"></div>

</div>

</div>

`;

});

document.getElementById(
"pageNo"
).innerHTML =

`${currentPage+1}/50`;

}

/* =========================
   PAGES
========================= */

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length-1;

}

renderPage();

}

/* =========================
   CLOCK
========================= */

function startClock(){

setInterval(()=>{

const now = new Date();

const h =
String(now.getHours())
.padStart(2,"0");

const m =
String(now.getMinutes())
.padStart(2,"0");

const s =
String(now.getSeconds())
.padStart(2,"0");

document.getElementById(
"clock"
).innerHTML =

`${h}:${m}:${s}`;

const remain =
60 - now.getSeconds();

document.getElementById(
"countdown"
).innerHTML =

remain + "s";

if(now.getSeconds() === 0){

fetchData();

}

},1000);

}

/* =========================
   FETCH LIVE
========================= */

async function fetchData(){

try{

document.getElementById(
"status"
).innerHTML =

"LIVE SERVER CONNECTED";

const res =
await fetch(
API + "?t=" + Date.now(),
{
cache:"no-store"
}
);

const data =
await res.json();

let list =
data.data.list || [];

if(!list.length){

return;

}

list.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

/* SAME CHECK */

if(
lastPeriod ===
list[0]?.issueNumber
){

advancedAI();
return;

}

lastPeriod =
list[0]?.issueNumber;

/* FORMAT */

let historyData =
list.map(x=>({

issueNumber:
String(x.issueNumber),

shortPeriod:
String(x.issueNumber)
.slice(-4),

number:
Number(x.number)

}));

/* MEMORY */

updateMemory(historyData);

/* BATCH */

makeBatches();

/* RENDER */

renderPage();

/* AI */

advancedAI();

/* NEXT PERIOD */

let latest =
memoryStore[0]
?.issueNumber || "0";

let next =
(
BigInt(latest)+1n
).toString();

document.getElementById(
"upcomingPeriod"
).innerHTML =

next.slice(-4);

}catch(e){

console.log(e);

document.getElementById(
"status"
).innerHTML =

"SERVER RECONNECTING...";

}

}

/* =========================
   AUTO UPDATE
========================= */

setInterval(()=>{

fetchData();

},5000);

document.addEventListener(
"visibilitychange",
()=>{

if(!document.hidden){

fetchData();

}

}
);

window.addEventListener(
"online",
()=>{

fetchData();

}
);

/* =========================
   START
========================= */

startClock();

fetchData();

</script>

</body>
</html>
