<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII ULTRA AI X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:15px;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:45px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 25px #000;
}

.center{
text-align:center;
}

.timer{
font-size:80px;
font-weight:bold;
color:#00ff99;
}

.predict{
font-size:65px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:140px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.conf{
font-size:30px;
margin-top:10px;
}

.signal{
font-size:26px;
margin-top:12px;
}

.bar{
height:10px;
background:#222;
border-radius:50px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:18px;
border-radius:15px;
line-height:33px;
font-size:17px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
font-size:16px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII ULTRA AI X</h1>
<p>REALTIME ADVANCED PATTERN DETECTOR</p>
</div>

<div class="card center">

<h2>⏳ LIVE COUNTDOWN</h2>

<div class="timer" id="timer">
00:00
</div>

</div>

<div class="card center">

<h2>🔮 LIVE AI DETECTION</h2>

<div class="predict" id="predict">
ANALYZING...
</div>

<div class="number" id="number">
--
</div>

<div class="conf" id="conf">
Confidence : 0%
</div>

<div class="signal" id="signal">
LEARNING LIVE FLOW...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading AI Engine...
</div>

</div>

<div class="card">

<h2>📊 LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII QUANTUM ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

// =====================
// TIMER
// =====================

function startTimer(){

function update(){

let now = new Date();

let sec = now.getSeconds();

let remain = 60-sec;

if(remain==60){
remain=0;
}

document.getElementById("timer").innerHTML =
"00:" +
String(remain).padStart(2,"0");

}

update();

setInterval(update,1000);

}

// =====================
// COLOR
// =====================

function getColor(num){

return [0,2,4,6,8].includes(num)
? "RED"
: "GREEN";

}

// =====================
// LOAD
// =====================

async function load(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

showHistory(list);

runAI(list);

}catch(err){

document.getElementById("predict")
.innerHTML =
"API ERROR";

}

}

// =====================
// HISTORY
// =====================

function showHistory(list){

document.getElementById("history")
.innerHTML = "";

list.slice(0,25).forEach(item=>{

let num = Number(item.number);

let color = getColor(num);

let type =
num>=5
? "BIG"
: "SMALL";

let cls =
color=="RED"
? "red"
: "green";

document.getElementById("history")
.innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

// =====================
// REAL AI
// =====================

function runAI(list){

let nums = [];

list.slice(0,50).forEach(item=>{

nums.push(Number(item.number));

});

let last = nums[0];

let pairMap = {};
let chainMap = {};
let movementMap = {};
let scores = {};

for(let i=0;i<=9;i++){

scores[i]=0;

}

// =====================
// PAIR LEARNING
// =====================

for(let i=0;i<nums.length-1;i++){

let prev = nums[i+1];
let next = nums[i];

if(!pairMap[prev]){
pairMap[prev]={};
}

if(!pairMap[prev][next]){
pairMap[prev][next]=0;
}

pairMap[prev][next]++;

}

// =====================
// CHAIN LEARNING
// =====================

for(let i=0;i<nums.length-3;i++){

let key =
nums[i+3]+"-"+
nums[i+2]+"-"+
nums[i+1];

let next =
nums[i];

if(!chainMap[key]){
chainMap[key]={};
}

if(!chainMap[key][next]){
chainMap[key][next]=0;
}

chainMap[key][next]++;

}

// =====================
// MOVEMENT LEARNING
// =====================

for(let i=0;i<nums.length-1;i++){

let diff =
nums[i]-nums[i+1];

if(!movementMap[diff]){
movementMap[diff]=0;
}

movementMap[diff]++;

}

// =====================
// LIVE CHAIN SCORE
// =====================

let liveKey =
nums[3]+"-"+
nums[2]+"-"+
nums[1];

if(chainMap[liveKey]){

Object.keys(chainMap[liveKey])
.forEach(n=>{

scores[n] +=
chainMap[liveKey][n]*45;

});

}

// =====================
// LIVE PAIR SCORE
// =====================

if(pairMap[last]){

Object.keys(pairMap[last])
.forEach(n=>{

scores[n] +=
pairMap[last][n]*25;

});

}

// =====================
// MOVEMENT ENGINE
// =====================

for(let n=0;n<=9;n++){

// distance

scores[n] +=
10-Math.abs(last-n);

// momentum

if(last > nums[1] && n > last){

scores[n]+=10;

}

if(last < nums[1] && n < last){

scores[n]+=10;

}

// odd even

if(last%2 == n%2){

scores[n]+=5;

}

// big small

if(
(last>=5 && n>=5) ||
(last<5 && n<5)
){

scores[n]+=7;

}

// repeat break

if(nums.slice(0,7).includes(n)){

scores[n]-=18;

}

// recent movement

for(let i=0;i<7;i++){

let diff =
Math.abs(nums[i]-n);

scores[n]+=
(10-diff);

}

}

// =====================
// REAL DETECT
// =====================

let sorted =
Object.entries(scores)
.sort((a,b)=>b[1]-a[1]);

let nextNumber =
Number(sorted[0][0]);

// SAME NUMBER FIX

if(nextNumber == last){

nextNumber =
Number(sorted[1][0]);

}

// =====================
// CONFIDENCE
// =====================

let top =
sorted[0][1];

let second =
sorted[1][1];

let confidence =
Math.floor(
(top/(top+second))*100
);

if(confidence<55){
confidence=55;
}

if(confidence>98){
confidence=98;
}

// =====================
// TYPE
// =====================

let nextType =
nextNumber>=5
? "🔴 BIG"
: "🟢 SMALL";

let cls =
nextNumber>=5
? "red"
: "green";

// =====================
// SIGNAL
// =====================

let signal = "";

if(confidence>=92){

signal =
"ULTRA LIVE SIGNAL";

}else if(confidence>=82){

signal =
"STRONG REAL SIGNAL";

}else{

signal =
"NORMAL LIVE SIGNAL";

}

// =====================
// UI
// =====================

document.getElementById("predict")
.innerHTML =
nextType;

document.getElementById("number")
.innerHTML =
nextNumber;

document.getElementById("number")
.className =
"number "+cls;

document.getElementById("conf")
.innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("signal")
.innerHTML =
signal;

document.getElementById("fill")
.style.width =
confidence+"%";

document.getElementById("analysis")
.innerHTML = `

<b>LIVE FLOW:</b><br>
${nums.slice(0,20).join(" → ")}<br><br>

<b>REAL DETECTED:</b><br>

${nextType}<br>
${nextNumber}<br><br>

<b>ADVANCED AI ENGINE:</b><br>

• Real Pair Learning<br>
• Live Chain Sequence Detection<br>
• Dynamic Movement Engine<br>
• Transition Pattern Reading<br>
• Repeat Break Detection<br>
• Adaptive Momentum Scan<br>
• Live Trend Mapping<br>
• Self Learning Probability System

`;

}

// =====================

startTimer();

load();

setInterval(load,1500);

</script>

</body>
</html>
