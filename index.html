<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII AI REAL ENGINE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:42px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.center{
text-align:center;
}

.timer{
font-size:75px;
font-weight:bold;
color:#00ff99;
}

.predict{
font-size:65px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:130px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.conf{
font-size:28px;
margin-top:10px;
}

.signal{
font-size:25px;
margin-top:10px;
}

.bar{
height:10px;
background:#222;
border-radius:50px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:18px;
border-radius:15px;
line-height:33px;
font-size:17px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII AI REAL ENGINE</h1>
<p>LIVE AUTO PATTERN DETECTION</p>
</div>

<div class="card center">

<h2>⏳ LIVE COUNTDOWN</h2>

<div class="timer" id="timer">
00:00
</div>

</div>

<div class="card center">

<h2>🔮 REAL TIME AI SIGNAL</h2>

<div class="predict" id="predictType">
ANALYZING...
</div>

<div class="number" id="predictNumber">
--
</div>

<div class="conf" id="confidence">
Confidence : 0%
</div>

<div class="signal" id="signal">
LIVE LEARNING...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading Live AI...
</div>

</div>

<div class="card">

<h2>📊 LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII QUANTUM AI
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let engine = {

pairs:{},
chains:{},
weights:{}

};

function getColor(num){

return [0,2,4,6,8].includes(num)
? "RED"
: "GREEN";

}

function startTimer(){

function update(){

let now = new Date();

let sec = now.getSeconds();

let remain = 60-sec;

if(remain==60){
remain=0;
}

document.getElementById("timer").innerHTML =
"00:" +
String(remain).padStart(2,"0");

}

update();

setInterval(update,1000);

}

function learn(nums){

engine.pairs = {};
engine.chains = {};
engine.weights = {};

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(!engine.pairs[current]){
engine.pairs[current]={};
}

if(!engine.pairs[current][next]){
engine.pairs[current][next]=0;
}

engine.pairs[current][next]++;

}

for(let i=0;i<nums.length-2;i++){

let key =
nums[i+2]+"-"+nums[i+1];

let next =
nums[i];

if(!engine.chains[key]){
engine.chains[key]={};
}

if(!engine.chains[key][next]){
engine.chains[key][next]=0;
}

engine.chains[key][next]++;

}

for(let i=0;i<nums.length;i++){

let n = nums[i];

if(!engine.weights[n]){
engine.weights[n]=0;
}

engine.weights[n] +=
(nums.length-i);

}

}

function detect(nums){

let last = nums[0];
let prev = nums[1];

let key =
prev+"-"+last;

let scores = {};

for(let i=0;i<=9;i++){
scores[i]=0;
}

// pair learning

if(engine.pairs[last]){

Object.keys(engine.pairs[last])
.forEach(n=>{

scores[n] +=
engine.pairs[last][n]*20;

});

}

// chain learning

if(engine.chains[key]){

Object.keys(engine.chains[key])
.forEach(n=>{

scores[n] +=
engine.chains[key][n]*35;

});

}

// movement analysis

for(let n=0;n<=9;n++){

// distance movement

scores[n] +=
10-Math.abs(last-n);

// same flow

if((last>=5 && n>=5) ||
(last<5 && n<5)){

scores[n]+=6;

}

// odd even momentum

if(last%2 == n%2){

scores[n]+=5;

}

// repeat break

if(nums.includes(n)){

scores[n]-=8;

}

}

// dynamic recent weights

Object.keys(engine.weights)
.forEach(n=>{

scores[n] +=
engine.weights[n]*0.3;

});

// best detect

let next =
Number(
Object.keys(scores).reduce((a,b)=>
scores[a]>scores[b]?a:b
)
);

return {
number:next,
scores:scores
};

}

async function loadData(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runAI(list);

}catch(err){

document.getElementById("predictType")
.innerHTML =
"API ERROR";

}

}

function renderHistory(list){

document.getElementById("history")
.innerHTML = "";

list.slice(0,20).forEach(item=>{

let num = Number(item.number);

let color = getColor(num);

let type =
num>=5
? "BIG"
: "SMALL";

let cls =
color=="RED"
? "red"
: "green";

document.getElementById("history")
.innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

function runAI(list){

let nums = [];

list.slice(0,40).forEach(item=>{

nums.push(Number(item.number));

});

learn(nums);

let result =
detect(nums);

let predicted =
result.number;

let type =
predicted>=5
? "🔴 BIG"
: "🟢 SMALL";

let color =
getColor(predicted);

let cls =
color=="RED"
? "red"
: "green";

let confidence = 75;

let values =
Object.values(result.scores);

let max =
Math.max(...values);

let avg =
values.reduce((a,b)=>a+b,0)
/values.length;

confidence +=
Math.floor(max-avg);

if(confidence>98){
confidence=98;
}

document.getElementById("predictType")
.innerHTML =
type;

document.getElementById("predictNumber")
.innerHTML =
predicted;

document.getElementById("predictNumber")
.className =
"number "+cls;

document.getElementById("confidence")
.innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("signal")
.innerHTML =
"REAL LIVE PATTERN";

document.getElementById("fill")
.style.width =
confidence+"%";

document.getElementById("analysis")
.innerHTML = `

<b>LAST FLOW:</b><br>
${nums.slice(0,15).join(" → ")}<br><br>

<b>LIVE DETECTED:</b><br>

<span class="${cls}">
${predicted}
</span>
(${color})<br><br>

<b>REAL ENGINE:</b><br>

• Live Pair Learning<br>
• Chain Sequence Detection<br>
• Dynamic Weight Engine<br>
• Real Time Transition Scan<br>
• Live Momentum Tracking<br>
• Repeat Break Detection<br>
• Adaptive Pattern Reading<br>
• Self Learning Signal Engine

`;

}

startTimer();

loadData();

setInterval(loadData,1500);

</script>

</body>
</html>
