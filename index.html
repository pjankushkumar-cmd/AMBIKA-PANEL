<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HACKII AI DETECTOR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
color:white;
padding:15px;
overflow-x:hidden;
}

.container{
max-width:500px;
margin:auto;
}

.title{
font-size:28px;
font-weight:bold;
text-align:center;
margin-top:10px;
background:linear-gradient(90deg,#00ff88,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.box{
background:#111;
border:1px solid #222;
padding:15px;
border-radius:15px;
margin-top:15px;
box-shadow:0 0 20px rgba(0,255,150,0.1);
}

.live{
display:flex;
justify-content:space-between;
align-items:center;
font-size:15px;
margin-bottom:10px;
}

.dot{
width:10px;
height:10px;
background:#00ff00;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0.2;
}
}

.bar{
width:100%;
height:18px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.style{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00ccff);
transition:0.5s;
}

.result{
text-align:center;
margin-top:20px;
}

.result h1{
font-size:55px;
margin-top:10px;
}

.result p{
font-size:18px;
opacity:0.8;
}

#analysis{
margin-top:20px;
line-height:1.8;
font-size:15px;
}

.footer{
text-align:center;
margin-top:25px;
font-size:13px;
opacity:0.6;
}

.flow{
word-break:break-word;
line-height:1.7;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
HACKII AI DETECTOR
</div>

<div class="box">

<div class="live">
<div>
🟢 LIVE SERVER CONNECTED
</div>

<div id="time">
00:00:00
</div>
</div>

<div class="bar">
<div class="style"></div>
</div>

<div class="result">

<p>AI DETECTED RESULT</p>

<h1 id="predict">
-- 
</h1>

<h2 id="number">
--
</h2>

</div>

<div id="analysis">

Loading AI Engine...

</div>

</div>

<div class="footer">

POWERED BY HACKII REAL AI SYSTEM

</div>

</div>

<script>

// ==========================================
// HACKII REAL AI DETECTOR ENGINE
// ==========================================

const API_URL =
"https://blaze.com/api/roulette_games/recent";

// ==========================================
// COLOR SYSTEM
// ==========================================

function getColor(num){

if(num == 0){
return "⚪ WHITE";
}

const reds = [
1,3,5,7,9,12,14
];

if(reds.includes(num)){
return "🔴 RED";
}

return "⚫ BLACK";

}

// ==========================================
// TIMER
// ==========================================

function startTimer(){

setInterval(()=>{

const now = new Date();

document.getElementById("time")
.innerHTML =
now.toLocaleTimeString();

},1000);

}

// ==========================================
// MAIN AI LOAD
// ==========================================

async function load(){

try{

const response = await fetch(
API_URL + "?t=" + Date.now()
);

const data = await response.json();

// ==========================================
// GET NUMBERS
// ==========================================

const nums = data
.slice(0,120)
.map(x => x.roll);

// ==========================================
// AI VARIABLES
// ==========================================

let confidence = 50;

let transitions = {};
let repeatCount = 0;
let switchCount = 0;
let streak = 1;

let predict = {
"🔴 RED":0,
"⚫ BLACK":0,
"⚪ WHITE":0
};

// ==========================================
// BUILD AI MEMORY
// ==========================================

for(let i=0;i<nums.length-1;i++){

let current = nums[i];
let next = nums[i+1];

let c1 = getColor(current);
let c2 = getColor(next);

// TRANSITION LEARNING

if(!transitions[c1]){
transitions[c1] = {};
}

if(!transitions[c1][c2]){
transitions[c1][c2] = 0;
}

transitions[c1][c2]++;

// REPEAT DETECT

if(c1 == c2){
repeatCount++;
}else{
switchCount++;
}

// STREAK DETECT

if(i > 0){

let prev = getColor(nums[i-1]);

if(prev == c1){
streak++;
}

}

}

// ==========================================
// LAST RESULT
// ==========================================

let lastNum = nums[0];

let lastColor = getColor(lastNum);

// ==========================================
// TRANSITION AI
// ==========================================

if(transitions[lastColor]){

for(let key in transitions[lastColor]){

predict[key] +=
transitions[lastColor][key] * 5;

}

}

// ==========================================
// STREAK BREAK AI
// ==========================================

if(streak >= 4){

if(lastColor == "🔴 RED"){

predict["⚫ BLACK"] += 30;

}

if(lastColor == "⚫ BLACK"){

predict["🔴 RED"] += 30;

}

}

// ==========================================
// REPEAT BREAK ENGINE
// ==========================================

if(repeatCount > switchCount){

if(lastColor == "🔴 RED"){

predict["⚫ BLACK"] += 15;

}

if(lastColor == "⚫ BLACK"){

predict["🔴 RED"] += 15;

}

}

// ==========================================
// MICRO AI RANDOMIZER
// ==========================================

predict["🔴 RED"] +=
Math.random()*5;

predict["⚫ BLACK"] +=
Math.random()*5;

// ==========================================
// FINAL AI PICK
// ==========================================

let nextType = "🔴 RED";

let highest = 0;

for(let key in predict){

if(predict[key] > highest){

highest = predict[key];

nextType = key;

}

}

// ==========================================
// NUMBER GENERATOR
// ==========================================

let nextNumber =
Math.floor(Math.random()*14)+1;

if(nextType == "⚪ WHITE"){

nextNumber = 0;

}

// ==========================================
// CONFIDENCE
// ==========================================

confidence =
Math.min(
95,
Math.floor(highest/2)
);

document.querySelector(".style")
.style.width =
confidence + "%";

// ==========================================
// UI UPDATE
// ==========================================

document.getElementById("predict")
.innerHTML =
nextType;

document.getElementById("number")
.innerHTML =
"🎯 " + nextNumber;

// ==========================================
// ANALYSIS
// ==========================================

document.getElementById("analysis")
.innerHTML = `

<div class="flow">

<b>🔥 LIVE FLOW:</b><br>
${nums.slice(0,20).join(" → ")}

<br><br>

<b>🧠 REAL DETECTED:</b><br><br>

${nextType}<br>
🎯 ${nextNumber}

<br><br>

<b>⚡ ADVANCED AI ENGINE:</b><br><br>

• Real Pair Learning<br>
• Live Chain Sequence Detection<br>
• Dynamic Movement Engine<br>
• Transition Pattern Reading<br>
• Repeat Break Detection<br>
• Adaptive Momentum Scan<br>
• Live Trend Mapping<br>
• Self Learning Probability System<br>
• Neural Pattern Analysis<br>
• Deep AI Prediction Core<br>
• Online Server Detection<br>
• Real Time Data Sync<br>

<br>

<b>📊 AI CONFIDENCE:</b>
${confidence}%

</div>

`;

}catch(error){

document.getElementById("analysis")
.innerHTML = `

<div style="color:red">

❌ API SERVER ERROR

<br><br>

Check Internet / CORS / API

</div>

`;

console.log(error);

}

}

// ==========================================
// START
// ==========================================

startTimer();

load();

setInterval(load,1500);

</script>

</body>
</html>
