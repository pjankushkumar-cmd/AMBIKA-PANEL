<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII QUANTUM AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:42px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.predict{
text-align:center;
}

.predictType{
font-size:55px;
font-weight:bold;
margin-top:10px;
}

.predictNumber{
font-size:100px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.violet{
color:#ff4dff;
}

.conf{
font-size:25px;
margin-top:10px;
}

.bar{
height:10px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.status{
margin-top:15px;
font-size:22px;
}

.analysis{
margin-top:20px;
background:#182447;
padding:15px;
border-radius:15px;
line-height:30px;
font-size:17px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII QUANTUM AI</h1>
<p>REAL UPCOMING NUMBER DETECTOR</p>
</div>

<div class="card predict">

<h2>UPCOMING AI DETECTION</h2>

<div class="predictType" id="predictType">
ANALYZING...
</div>

<div class="predictNumber" id="predictNumber">
--
</div>

<div class="conf" id="confidence">
Confidence : 0%
</div>

<div class="status" id="signal">
WAITING LIVE DATA...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Reading live API...
</div>

</div>

<div class="card">

<h2>LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII QUANTUM ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

async function loadData(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runQuantumAI(list);

}catch(err){

document.getElementById("predictType").innerHTML =
"API ERROR";

}

}

function getColor(n){

if([0,2,4,6,8].includes(n)){
return "RED";
}

return "GREEN";

}

function renderHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,15).forEach(item=>{

let n = Number(item.number);

let color = getColor(n);

let type = n >=5 ? "BIG":"SMALL";

let cls = color=="RED" ? "red":"green";

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${n}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

function runQuantumAI(list){

let nums = [];

list.slice(0,15).forEach(item=>{

nums.push(Number(item.number));

});

let score = {};

for(let i=0;i<=9;i++){
score[i]=0;
}

for(let i=0;i<nums.length-1;i++){

let current = nums[i];
let prev = nums[i+1];

for(let n=0;n<=9;n++){

let distance =
Math.abs(current-n);

score[n] += (10-distance);

if(n%2 == current%2){
score[n]+=4;
}

if(
(n>=5 && current>=5) ||
(n<5 && current<5)
){
score[n]+=6;
}

if(Math.abs(prev-current)<=2 &&
Math.abs(current-n)<=2){
score[n]+=10;
}

}

}

nums.forEach(n=>{

score[n]-=10;

});

let upcoming = Number(
Object.keys(score).reduce((a,b)=>
score[a]>score[b]?a:b
));

let type =
upcoming>=5
? "🔴 BIG"
: "🟢 SMALL";

let color = getColor(upcoming);

let cls =
color=="RED"
? "red"
: "green";

let confidence = 78;

let bigs =
nums.filter(n=>n>=5).length;

let smalls =
nums.filter(n=>n<5).length;

if(upcoming>=5 && bigs>smalls){
confidence += 7;
}

if(upcoming<5 && smalls>bigs){
confidence += 7;
}

let odd =
nums.filter(n=>n%2!=0).length;

let even =
nums.filter(n=>n%2==0).length;

if(upcoming%2==0 && even>odd){
confidence += 5;
}

if(upcoming%2!=0 && odd>even){
confidence += 5;
}

if(Math.abs(nums[0]-upcoming)<=2){
confidence += 6;
}

if(confidence>98){
confidence=98;
}

let signal = "NORMAL AI SIGNAL";

if(confidence>=90){

signal="ULTRA STRONG AI";

}else if(confidence>=82){

signal="STRONG LIVE AI";

}

document.getElementById("predictType").innerHTML =
type;

document.getElementById("predictNumber").innerHTML =
upcoming;

document.getElementById("predictNumber").className =
"predictNumber "+cls;

document.getElementById("confidence").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("signal").innerHTML =
signal;

document.getElementById("fill").style.width =
confidence+"%";

document.getElementById("analysis").innerHTML = `

<b>Upcoming Number:</b>
<span class="${cls}">
${upcoming}
</span><br><br>

<b>Upcoming Color:</b>
<span class="${cls}">
${color}
</span><br><br>

<b>Upcoming Type:</b>
${type}<br><br>

<b>AI Detection:</b><br>
• Live Heatmap Engine<br>
• Momentum Detection<br>
• Big/Small Pressure<br>
• Odd/Even Tracking<br>
• Transition Pattern Reading<br>
• Repeat Break Analysis<br>
• Distance Cycle Matching<br>
• Upcoming Trend Scan

`;

}

loadData();

setInterval(loadData,2000);

</script>

</body>
</html>
