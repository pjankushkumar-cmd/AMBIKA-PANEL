<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII REAL AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:42px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.center{
text-align:center;
}

.timer{
font-size:75px;
font-weight:bold;
color:#00ff99;
}

.predict{
font-size:60px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:130px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.conf{
font-size:28px;
margin-top:10px;
}

.signal{
font-size:25px;
margin-top:10px;
}

.bar{
height:10px;
background:#222;
border-radius:50px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:18px;
border-radius:15px;
line-height:33px;
font-size:17px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII REAL AI</h1>
<p>LIVE REALTIME PATTERN DETECTION</p>
</div>

<div class="card center">

<h2>⏳ LIVE COUNTDOWN</h2>

<div class="timer" id="timer">
00:00
</div>

</div>

<div class="card center">

<h2>🔮 LIVE AI SIGNAL</h2>

<div class="predict" id="predict">
ANALYZING...
</div>

<div class="number" id="number">
--
</div>

<div class="conf" id="conf">
Confidence : 0%
</div>

<div class="signal" id="status">
LIVE LEARNING...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading AI...
</div>

</div>

<div class="card">

<h2>📊 LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII AI ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

// ==========================
// TIMER
// ==========================

function startTimer(){

function update(){

let now = new Date();

let sec = now.getSeconds();

let remain = 60-sec;

if(remain==60){
remain=0;
}

document.getElementById("timer").innerHTML =
"00:" +
String(remain).padStart(2,"0");

}

update();

setInterval(update,1000);

}

// ==========================
// COLOR
// ==========================

function getColor(num){

return [0,2,4,6,8].includes(num)
? "RED"
: "GREEN";

}

// ==========================
// LOAD DATA
// ==========================

async function load(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

showHistory(list);

analyze(list);

}catch(err){

document.getElementById("predict")
.innerHTML = "API ERROR";

}

}

// ==========================
// SHOW HISTORY
// ==========================

function showHistory(list){

document.getElementById("history")
.innerHTML = "";

list.slice(0,20).forEach(item=>{

let num = Number(item.number);

let color = getColor(num);

let type =
num>=5
? "BIG"
: "SMALL";

let cls =
color=="RED"
? "red"
: "green";

document.getElementById("history")
.innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

// ==========================
// REAL ANALYSIS
// ==========================

function analyze(list){

let nums = [];
let bs = [];

list.slice(0,30).forEach(item=>{

let n = Number(item.number);

nums.push(n);

bs.push(n >= 5 ? "B" : "S");

});

let last = nums[0];

let transitions = {};
let chainMap = {};
let scores = {};

for(let i=0;i<=9;i++){
scores[i]=0;
}

// =======================
// TRANSITION LEARNING
// =======================

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(!transitions[current]){
transitions[current] = {};
}

if(!transitions[current][next]){
transitions[current][next] = 0;
}

transitions[current][next]++;

}

// =======================
// 3 CHAIN LEARNING
// =======================

for(let i=0;i<nums.length-3;i++){

let key =
nums[i+3]+"-"+
nums[i+2]+"-"+
nums[i+1];

let next = nums[i];

if(!chainMap[key]){
chainMap[key] = {};
}

if(!chainMap[key][next]){
chainMap[key][next] = 0;
}

chainMap[key][next]++;

}

let liveKey =
nums[3]+"-"+
nums[2]+"-"+
nums[1];

// =======================
// CHAIN SCORE
// =======================

if(chainMap[liveKey]){

Object.keys(chainMap[liveKey])
.forEach(n=>{

scores[n] +=
chainMap[liveKey][n] * 40;

});

}

// =======================
// TRANSITION SCORE
// =======================

if(transitions[last]){

Object.keys(transitions[last])
.forEach(n=>{

scores[n] +=
transitions[last][n] * 20;

});

}

// =======================
// LIVE FLOW ANALYSIS
// =======================

for(let n=0;n<=9;n++){

scores[n] +=
10 - Math.abs(last-n);

// trend direction

if(last > nums[1] && n > last){
scores[n] += 10;
}

if(last < nums[1] && n < last){
scores[n] += 10;
}

// big small momentum

if(
(last>=5 && n>=5) ||
(last<5 && n<5)
){
scores[n] += 7;
}

// odd even flow

if(last%2 == n%2){
scores[n] += 5;
}

// recent repeat break

if(nums.slice(0,5).includes(n)){
scores[n] -= 15;
}

// recent movement

for(let i=0;i<5;i++){

let diff =
Math.abs(nums[i]-n);

scores[n] +=
(10-diff);

}

}

// =======================
// FINAL DETECT
// =======================

let nextNumber =
Number(
Object.keys(scores)
.reduce((a,b)=>
scores[a] > scores[b]
? a : b
)
);

// fix same repeat issue

if(nextNumber == last){

scores[nextNumber] -= 50;

nextNumber =
Number(
Object.keys(scores)
.reduce((a,b)=>
scores[a] > scores[b]
? a : b
)
);

}

// =======================
// REAL CONFIDENCE
// =======================

let sorted =
Object.values(scores)
.sort((a,b)=>b-a);

let top = sorted[0];
let second = sorted[1];

let confidence =
Math.floor(
(top/(top+second))*100
);

if(confidence > 98){
confidence = 98;
}

if(confidence < 55){
confidence = 55;
}

// =======================
// TYPE
// =======================

let nextType =
nextNumber >=5
? "🔴 BIG"
: "🟢 SMALL";

// =======================
// SIGNAL
// =======================

let signal = "";

if(confidence >= 90){

signal = "ULTRA LIVE SIGNAL";

}else if(confidence >= 80){

signal = "STRONG REAL SIGNAL";

}else{

signal = "NORMAL LIVE SIGNAL";

}

// =======================
// UI UPDATE
// =======================

document.getElementById("predict")
.innerHTML =
nextType;

document.getElementById("number")
.innerHTML =
nextNumber;

document.getElementById("number")
.className =
"number " +
(nextNumber>=5 ? "red":"green");

document.getElementById("conf")
.innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("status")
.innerHTML =
signal;

document.getElementById("fill")
.style.width =
confidence+"%";

document.getElementById("analysis")
.innerHTML = `

<b>LIVE FLOW:</b><br>
${nums.slice(0,15).join(" → ")}<br><br>

<b>DETECTED SIGNAL:</b><br>
${nextType}<br>
${nextNumber}<br><br>

<b>REAL ANALYSIS:</b><br>

• Live Transition Learning<br>
• 3 Chain Pattern Detection<br>
• Real Momentum Reading<br>
• Adaptive Repeat Break<br>
• Dynamic Movement Tracking<br>
• Recent Flow Analysis<br>
• Real Confidence Engine<br>
• Live Sequence Detection

`;

}

// ==========================

startTimer();

load();

setInterval(load,2000);

</script>

</body>
</html>
