<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII REALTIME AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:15px;
}

.container{
max-width:1100px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:42px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.center{
text-align:center;
}

.countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
margin-top:10px;
}

.predict{
font-size:60px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:120px;
font-weight:bold;
margin-top:10px;
}

.red{
color:#ff4545;
}

.green{
color:#00ff66;
}

.conf{
font-size:28px;
margin-top:10px;
}

.signal{
margin-top:15px;
font-size:24px;
}

.bar{
height:10px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:15px;
border-radius:15px;
line-height:32px;
font-size:17px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
font-size:17px;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII REALTIME AI</h1>
<p>LIVE SELF LEARNING PATTERN ENGINE</p>
</div>

<div class="card center">

<h2>⏳ NEXT ROUND</h2>

<div class="countdown" id="timer">
00:00
</div>

</div>

<div class="card center">

<h2>🔮 LIVE DETECTION</h2>

<div class="predict" id="predictType">
WAITING...
</div>

<div class="number" id="predictNumber">
--
</div>

<div class="conf" id="confidence">
Confidence : 0%
</div>

<div class="signal" id="signal">
LEARNING LIVE PATTERNS...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading Live AI...
</div>

</div>

<div class="card">

<h2>📊 LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII QUANTUM AI
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

const memory = {

transitions:{}

};

function getColor(num){

if([0,2,4,6,8].includes(num)){
return "RED";
}

return "GREEN";

}

function startTimer(){

function update(){

let now = new Date();

let sec = now.getSeconds();

let remain = 60-sec;

if(remain==60){
remain=0;
}

document.getElementById("timer").innerHTML =
"00:" +
String(remain).padStart(2,"0");

}

update();

setInterval(update,1000);

}

function learnPatterns(nums){

memory.transitions = {};

for(let i=nums.length-1;i>0;i--){

const prev = nums[i];
const next = nums[i-1];

if(!memory.transitions[prev]){
memory.transitions[prev] = {};
}

if(!memory.transitions[prev][next]){
memory.transitions[prev][next] = 0;
}

memory.transitions[prev][next]++;

}

}

function detectNext(last){

if(!memory.transitions[last]){
return null;
}

let map = memory.transitions[last];

let best =
Object.keys(map).reduce((a,b)=>
map[a] > map[b] ? a : b
);

return Number(best);

}

async function loadData(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runRealtimeAI(list);

}catch(err){

document.getElementById("predictType").innerHTML =
"API ERROR";

}

}

function renderHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,20).forEach(item=>{

let num = Number(item.number);

let type =
num>=5
? "BIG"
: "SMALL";

let color = getColor(num);

let cls =
color=="RED"
? "red"
: "green";

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

function runRealtimeAI(list){

let nums = [];

list.slice(0,30).forEach(item=>{

nums.push(Number(item.number));

});

learnPatterns(nums);

let last = nums[0];

let predicted = detectNext(last);

if(predicted==null){

document.getElementById("predictType").innerHTML =
"NO SIGNAL";

return;

}

let type =
predicted>=5
? "🔴 BIG"
: "🟢 SMALL";

let color = getColor(predicted);

let cls =
color=="RED"
? "red"
: "green";

let confidence = 70;

let map =
memory.transitions[last];

if(map && map[predicted]){

confidence += map[predicted]*8;

}

if(confidence>98){
confidence=98;
}

document.getElementById("predictType").innerHTML =
type;

document.getElementById("predictNumber").innerHTML =
predicted;

document.getElementById("predictNumber").className =
"number "+cls;

document.getElementById("confidence").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("signal").innerHTML =
"REALTIME LIVE SIGNAL";

document.getElementById("fill").style.width =
confidence+"%";

document.getElementById("analysis").innerHTML = `

<b>LIVE LAST NUMBER:</b>
${last}<br><br>

<b>UPCOMING DETECTED:</b><br>

<span class="${cls}">
${predicted}
</span><br><br>

<b>REALTIME ANALYSIS:</b><br>

• Self Learning Engine<br>
• Live Transition Tracking<br>
• Real Time Pattern Reading<br>
• Auto Adaptive Detection<br>
• Dynamic Sequence Learning<br>
• Live API Flow Scan<br>
• Real Signal Detection<br><br>

<b>Transition Memory:</b><br>

${JSON.stringify(memory.transitions[last],null,2)}

`;

}

startTimer();

loadData();

setInterval(loadData,2000);

</script>

</body>
</html>
