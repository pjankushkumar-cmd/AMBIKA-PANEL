<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADVANCED AI ANALYZER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#14133a;
color:white;
padding:15px;
}

.topBox{
background:#1e1d55;
border-radius:22px;
padding:20px;
margin-bottom:20px;
}

.heading{
font-size:30px;
font-weight:bold;
text-align:center;
color:#b39cff;
margin-bottom:20px;
}

.upcomingBox{
background:#2d2b73;
border-radius:18px;
padding:18px;
text-align:center;
}

.upcomingTitle{
font-size:18px;
margin-bottom:10px;
color:#ddd;
}

.upcomingPeriod{
font-size:20px;
margin-bottom:15px;
color:#fff;
word-break:break-all;
}

.predictNum{
font-size:65px;
font-weight:bold;
color:#00ff9d;
}

.aiText{
margin-top:10px;
font-size:18px;
color:#ffd966;
}

.batchCard{
background:#1e1d55;
border-radius:22px;
padding:20px;
margin-bottom:20px;
}

.tableHeader{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
margin-bottom:18px;
font-size:19px;
color:#d9d9ff;
}

.row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
align-items:center;
padding:16px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}

.period{
font-size:15px;
word-break:break-all;
}

.number{
font-size:55px;
font-weight:bold;
text-align:center;
}

.bigsmall{
font-size:20px;
text-align:center;
}

.colorBox{
display:flex;
justify-content:center;
gap:8px;
}

.dot{
width:18px;
height:18px;
border-radius:50%;
}

.red{
background:#ff3b3b;
}

.green{
background:#00d26a;
}

.violet{
background:#ff4dff;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin-top:20px;
}

.pageBtn{
width:65px;
height:65px;
border:none;
border-radius:16px;
background:#8f7dff;
color:white;
font-size:38px;
cursor:pointer;
}

.pageCount{
font-size:28px;
}

</style>
</head>

<body>

<div class="topBox">

<div class="heading">
ADVANCED AI ANALYZER
</div>

<div class="upcomingBox">

<div class="upcomingTitle">
UPCOMING PERIOD
</div>

<div class="upcomingPeriod" id="upcomingPeriod">
Loading...
</div>

<div class="predictNum" id="prediction">
--
</div>

<div class="aiText" id="aiText">
AI ANALYZING...
</div>

</div>

</div>

<div class="batchCard">

<div class="tableHeader">
<div>Period</div>
<div style="text-align:center;">Number</div>
<div style="text-align:center;">Big Small</div>
<div style="text-align:center;">Color</div>
</div>

<div id="historyTable"></div>

<div class="pagination">

<button class="pageBtn"
onclick="prevPage()">
‹
</button>

<div class="pageCount"
id="pageCount">
1/50
</div>

<button class="pageBtn"
onclick="nextPage()">
›
</button>

</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let allResults = [];

let batches = [];

let currentPage = 0;

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

function getColor(n){

if([0,2,4,6,8].includes(n)){
return ["red"];
}

return ["green"];

}

function createBatches(data){

let temp = [];

for(let i=0;i<data.length;i+=10){

temp.push(
data.slice(i,i+10)
);

}

while(temp.length > 50){

temp.shift();

}

batches = temp.reverse();

}

function advancedAIAnalysis(){

let nums =
allResults.map(x=>x.number);

let score = {};

for(let i=0;i<=9;i++){

score[i]=0;

}

let recentWeight = 1;

for(let i=nums.length-1;i>=1;i--){

let current = nums[i];
let prev = nums[i-1];

score[current] += recentWeight;

if(current === prev){

score[current] += 5;

}

if(getBigSmall(current)
=== getBigSmall(prev)){

score[current] += 2;

}

recentWeight += 0.08;

}

let best = 0;
let highest = 0;

for(let n in score){

if(score[n] > highest){

highest = score[n];
best = Number(n);

}

}

let conf =
Math.min(
95,
((highest /
Object.values(score)
.reduce((a,b)=>a+b,0)
)*100 + 50)
).toFixed(1);

document.getElementById(
"prediction"
).innerHTML = best;

document.getElementById(
"aiText"
).innerHTML =

`AI DETECT:
${getBigSmall(best)}
•
${getColor(best)[0].toUpperCase()}
•
${conf}% Confidence`;

}

function renderPage(){

const table =
document.getElementById(
"historyTable"
);

table.innerHTML = "";

if(!batches[currentPage]) return;

batches[currentPage]
.forEach(item=>{

let colorClass =
getColor(item.number)[0];

table.innerHTML += `

<div class="row">

<div class="period">
${item.issueNumber}
</div>

<div class="number"
style="color:
${colorClass==="red"
? "#ff4b4b"
: "#00ff9d"}">

${item.number}

</div>

<div class="bigsmall">

${getBigSmall(item.number)}

</div>

<div class="colorBox">

<div class="dot ${colorClass}"></div>

</div>

</div>

`;

});

document.getElementById(
"pageCount"
).innerHTML =

`${currentPage+1}/50`;

}

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length-1;

}

renderPage();

}

async function loadData(){

try{

const res =
await fetch(API);

const data =
await res.json();

let list =
data.data.list || [];

allResults = list.map(x=>({

issueNumber:
x.issueNumber,

number:
Number(x.number)

}));

allResults.reverse();

createBatches(allResults);

renderPage();

advancedAIAnalysis();

let latestPeriod =
allResults[
allResults.length-1
]?.issueNumber || 0;

document.getElementById(
"upcomingPeriod"
).innerHTML =

String(
Number(latestPeriod)+1
);

}catch(e){

console.log(e);

}

}

loadData();

setInterval(loadData,60000);

</script>

</body>
</html>
