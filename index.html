<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ULTIMATE LIVE AI ANALYZER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#16153d;
padding:10px;
color:white;
overflow-x:hidden;
}

.main{
max-width:700px;
margin:auto;
}

.top{
background:#221f67;
border-radius:24px;
padding:16px;
margin-bottom:15px;
}

.title{
font-size:32px;
font-weight:bold;
text-align:center;
color:#c8a2ff;
margin-bottom:20px;
}

.predictBox{
background:#342f8f;
padding:18px;
border-radius:18px;
text-align:center;
}

.smallTitle{
font-size:18px;
color:#eee;
}

.period{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

.predict{
font-size:110px;
font-weight:bold;
margin-top:10px;
transition:.3s;
}

.redText{
color:#ff4b5c;
text-shadow:0 0 15px #ff4b5c;
}

.greenText{
color:#00ff99;
text-shadow:0 0 15px #00ff99;
}

.ai{
font-size:20px;
color:#ffd86a;
margin-top:15px;
line-height:1.5;
}

.time{
margin-top:25px;
font-size:20px;
}

.clock{
font-size:38px;
font-weight:bold;
color:#00ffd5;
margin-top:10px;
}

.count{
font-size:75px;
font-weight:bold;
color:#ffd54f;
margin-top:10px;
}

.table{
background:#221f67;
border-radius:24px;
overflow:hidden;
}

.header{
background:#5a53b5;
display:grid;
grid-template-columns:1.5fr .7fr .9fr .6fr;
padding:15px 10px;
font-weight:bold;
font-size:16px;
}

.row{
display:grid;
grid-template-columns:1.5fr .7fr .9fr .6fr;
padding:14px 10px;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.periodText{
font-size:16px;
font-weight:bold;
}

.num{
font-size:56px;
font-weight:bold;
text-align:center;
}

.bs{
font-size:18px;
text-align:center;
}

.colorWrap{
display:flex;
justify-content:center;
gap:8px;
}

.dot{
width:16px;
height:16px;
border-radius:50%;
}

.red{
background:#ff4b5c;
box-shadow:0 0 10px #ff4b5c;
}

.green{
background:#00ff99;
box-shadow:0 0 10px #00ff99;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
background:#221f67;
padding:18px;
border-radius:24px;
margin-top:15px;
}

.btn{
width:65px;
height:65px;
border:none;
border-radius:18px;
background:#8f7dff;
color:white;
font-size:38px;
cursor:pointer;
}

.page{
font-size:24px;
font-weight:bold;
}

.loader{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

</style>

</head>

<body>

<div class="main">

<div class="top">

<div class="title">
ULTIMATE LIVE AI ANALYZER
</div>

<div class="predictBox">

<div class="smallTitle">
UPCOMING PERIOD
</div>

<div class="period"
id="upcomingPeriod">
0000
</div>

<div class="predict loader"
id="predictNum">
--
</div>

<div class="ai"
id="aiText">
AI ANALYZING LIVE TREND...
</div>

<div class="time">
SERVER TIME
</div>

<div class="clock"
id="clock">
00:00:00
</div>

<div class="time">
NEXT UPDATE IN
</div>

<div class="count"
id="countdown">
60s
</div>

</div>

</div>

<div class="table">

<div class="header">

<div>Period</div>
<div style="text-align:center;">Number</div>
<div style="text-align:center;">Big/Small</div>
<div style="text-align:center;">Color</div>

</div>

<div id="history"></div>

</div>

<div class="pagination">

<button class="btn"
onclick="prevPage()">
‹
</button>

<div class="page"
id="pageNo">
1/50
</div>

<button class="btn"
onclick="nextPage()">
›
</button>

</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let historyData = [];
let batches = [];
let currentPage = 0;
let lastPeriod = "";

/* =========================
   KEEP SCREEN ACTIVE
========================= */

async function keepAwake(){

try{

if('wakeLock' in navigator){

await navigator.wakeLock.request('screen');

}

}catch(e){}

}

keepAwake();

/* =========================
   HELPERS
========================= */

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

function getColor(n){

return [0,2,4,6,8]
.includes(n)
? "red"
: "green";

}

function getClass(n){

return [0,2,4,6,8]
.includes(n)
? "redText"
: "greenText";

}

/* =========================
   BATCH SYSTEM
========================= */

function makeBatches(arr){

let temp = [];

for(let i=0;i<arr.length;i+=10){

temp.push(
arr.slice(i,i+10)
);

}

while(temp.length > 50){

temp.shift();

}

batches = temp;

}

/* =========================
   ADVANCED AI
========================= */

function advancedAI(){

if(historyData.length < 30){

document.getElementById(
"predictNum"
).innerHTML = "0";

return;

}

let nums =
historyData.map(x=>x.number);

let score = {};
let transitions = {};
let recent = {};
let cycles = {};
let repeats = {};
let hot = {};

for(let i=0;i<=9;i++){

score[i]=0;
recent[i]=0;
cycles[i]=0;
repeats[i]=0;
hot[i]=0;

}

/* TRANSITIONS */

for(let i=0;i<nums.length-1;i++){

let a = nums[i];
let b = nums[i+1];

if(!transitions[a]){

transitions[a] = {};

}

if(!transitions[a][b]){

transitions[a][b] = 0;

}

transitions[a][b]++;

}

/* RECENT */

let w = 1;

for(let i=nums.length-1;i>=0;i--){

recent[nums[i]] += w;

w += 0.15;

}

/* REPEAT */

for(let i=1;i<nums.length;i++){

if(nums[i]===nums[i-1]){

repeats[nums[i]] += 5;

}

}

/* CYCLE */

for(let i=2;i<nums.length;i++){

if(nums[i]===nums[i-2]){

cycles[nums[i]] += 4;

}

}

/* HOT */

for(let i=nums.length-10;i<nums.length;i++){

if(nums[i]!==undefined){

hot[nums[i]] += 3;

}

}

/* LAST FLOW */

let last =
nums[nums.length-1];

if(transitions[last]){

for(let n in transitions[last]){

score[n] +=
transitions[last][n] * 10;

}

}

/* COMBINE */

for(let i=0;i<=9;i++){

score[i] += recent[i];
score[i] += repeats[i];
score[i] += cycles[i];
score[i] += hot[i];

}

/* AVOID SAME */

score[last] *= 0.25;

/* BEST */

let sorted =
Object.entries(score)
.sort((a,b)=>b[1]-a[1]);

let best =
Number(sorted[0][0]);

/* CONFIDENCE */

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let conf =
Math.min(
96,
(
(score[best]/total)*100
+ 40
).toFixed(1)
);

/* UI */

document.getElementById(
"predictNum"
).innerHTML = best;

document.getElementById(
"predictNum"
).className =

`predict ${getClass(best)}`;

document.getElementById(
"aiText"
).innerHTML =

`AI DETECT:
${getBigSmall(best)}
 •
${getColor(best).toUpperCase()}
 •
${conf}% Confidence`;

}

/* =========================
   RENDER
========================= */

function renderPage(){

const box =
document.getElementById(
"history"
);

box.innerHTML = "";

if(!batches[currentPage])
return;

batches[currentPage]
.forEach(item=>{

box.innerHTML += `

<div class="row">

<div class="periodText">

${item.shortPeriod}

</div>

<div class="num ${getClass(item.number)}">

${item.number}

</div>

<div class="bs">

${getBigSmall(item.number)}

</div>

<div class="colorWrap">

<div class="dot ${getColor(item.number)}"></div>

</div>

</div>

`;

});

document.getElementById(
"pageNo"
).innerHTML =

`${currentPage+1}/50`;

}

/* =========================
   PAGES
========================= */

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length-1;

}

renderPage();

}

/* =========================
   CLOCK
========================= */

function startClock(){

setInterval(()=>{

const now = new Date();

const h =
String(now.getHours())
.padStart(2,"0");

const m =
String(now.getMinutes())
.padStart(2,"0");

const s =
String(now.getSeconds())
.padStart(2,"0");

document.getElementById(
"clock"
).innerHTML =

`${h}:${m}:${s}`;

const remain =
60 - now.getSeconds();

document.getElementById(
"countdown"
).innerHTML =

remain + "s";

if(now.getSeconds() === 0){

fetchData();

}

},1000);

}

/* =========================
   FETCH LIVE DATA
========================= */

async function fetchData(){

try{

const res =
await fetch(
API + "?t=" + Date.now(),
{
cache:"no-store"
}
);

const data =
await res.json();

let list =
data.data.list || [];

if(!list.length){

return;

}

list.sort((a,b)=>
Number(b.issueNumber)
-
Number(a.issueNumber)
);

/* DUPLICATE CHECK */

if(
lastPeriod ===
list[0]?.issueNumber
){

advancedAI();
return;

}

lastPeriod =
list[0]?.issueNumber;

/* SAVE HISTORY */

historyData =
list.map(x=>({

issueNumber:
String(x.issueNumber),

shortPeriod:
String(x.issueNumber)
.slice(-4),

number:
Number(x.number)

}));

/* FILL MEMORY */

while(historyData.length < 500){

historyData.push(
...historyData
);

}

historyData =
historyData.slice(0,500);

/* CREATE BATCH */

makeBatches(historyData);

/* RENDER */

renderPage();

/* AI */

advancedAI();

/* NEXT PERIOD */

let latest =
historyData[0]
?.issueNumber || "0";

let next =
String(
BigInt(latest)+1n
);

document.getElementById(
"upcomingPeriod"
).innerHTML =

next.slice(-4);

}catch(e){

console.log(e);

document.getElementById(
"aiText"
).innerHTML =

"SERVER RECONNECTING...";

}

}

/* =========================
   BACKGROUND UPDATE
========================= */

setInterval(()=>{

fetchData();

},5000);

document.addEventListener(
"visibilitychange",
()=>{

if(!document.hidden){

fetchData();

}

}
);

window.addEventListener(
"online",
()=>{

fetchData();

}
);

/* =========================
   START
========================= */

startClock();

fetchData();

</script>

</body>
</html>
