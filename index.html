<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Live Trend Analyzer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081018;
color:white;
padding:15px;
}

.title{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:20px;
color:#00ffd5;
}

.card{
background:#101c2b;
border:1px solid #1d3247;
padding:18px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(0,255,213,.08);
}

.live{
font-size:60px;
font-weight:bold;
text-align:center;
margin-top:10px;
}

.predict{
font-size:45px;
font-weight:bold;
color:#00ffd5;
text-align:center;
margin-top:10px;
}

.conf{
text-align:center;
margin-top:10px;
font-size:18px;
color:#ffe066;
}

.row{
display:flex;
justify-content:center;
gap:10px;
margin-top:12px;
flex-wrap:wrap;
}

.tag{
padding:8px 16px;
border-radius:14px;
font-weight:bold;
}

.red{
background:#ff3b3b;
}

.green{
background:#00c853;
}

.big{
background:#ff9800;
}

.small{
background:#0091ea;
}

.batch{
background:#101c2b;
padding:15px;
border-radius:18px;
margin-bottom:15px;
border:1px solid #1d3247;
}

.batchTitle{
font-size:22px;
margin-bottom:15px;
color:#00ffd5;
}

.numbers{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.num{
width:45px;
height:45px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:18px;
background:#18293b;
}

.arrow{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin-top:15px;
background:#00ffd5;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.stats{
margin-top:15px;
line-height:1.8;
font-size:16px;
}

</style>
</head>

<body>

<div class="title">
ADVANCED LIVE TREND ANALYZER
</div>

<div class="card">

<div>
LIVE RESULT
</div>

<div class="live" id="liveResult">
--
</div>

</div>

<div class="card">

<div>
AI NEXT ANALYSIS
</div>

<div class="predict" id="prediction">
--
</div>

<div class="conf" id="confidence">
Confidence 0%
</div>

<div class="row">

<div id="sizeType"></div>

<div id="colorType"></div>

</div>

<div class="stats" id="stats"></div>

</div>

<div id="batchContainer"></div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let batches = [];

let currentView = 0;

function getColor(n){

return [0,2,4,6,8].includes(n)
? "RED"
: "GREEN";

}

function getSize(n){

return n <= 4
? "SMALL"
: "BIG";

}

async function fetchData(){

try{

const res = await fetch(API);

const data = await res.json();

let list =
data.data.list || [];

let numbers =
list.map(x=>Number(x.number));

numbers.reverse();

buildBatches(numbers);

renderCurrent();

analyze();

}catch(e){

console.log(e);

}

}

function buildBatches(numbers){

let temp = [];

for(let i=0;i<numbers.length;i+=10){

temp.push(
numbers.slice(i,i+10)
);

}

while(temp.length > 50){

temp.shift();

}

batches = temp;

}

function flatten(){

return batches.flat();

}

function analyze(){

let all = flatten();

if(all.length < 5) return;

let score = {};

for(let i=0;i<=9;i++){

score[i] = 0;

}

let weight = 1;

for(let i=1;i<all.length;i++){

let prev = all[i-1];

let current = all[i];

score[current] += weight;

if(prev === current){

score[current] += 3;

}

if(getColor(prev) === getColor(current)){

score[current] += 2;

}

if(getSize(prev) === getSize(current)){

score[current] += 2;

}

weight += 0.05;

}

let best = 0;

let high = 0;

for(let n in score){

if(score[n] > high){

high = score[n];

best = Number(n);

}

}

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let conf =
Math.min(
95,
((high/total)*100+45)
).toFixed(1);

document.getElementById("prediction")
.innerHTML = best;

document.getElementById("confidence")
.innerHTML =
"Confidence "+conf+"%";

let size = getSize(best);

let color = getColor(best);

document.getElementById("sizeType")
.innerHTML =
`<div class="tag ${size.toLowerCase()}">${size}</div>`;

document.getElementById("colorType")
.innerHTML =
`<div class="tag ${color.toLowerCase()}">${color}</div>`;

let red =
all.filter(x=>getColor(x)=="RED").length;

let green =
all.length-red;

let small =
all.filter(x=>x<=4).length;

let big =
all.length-small;

document.getElementById("stats")
.innerHTML = `

Total Results: ${all.length}<br>
RED: ${red}<br>
GREEN: ${green}<br>
SMALL: ${small}<br>
BIG: ${big}

`;

}

function renderCurrent(){

const box =
document.getElementById("batchContainer");

box.innerHTML = "";

if(!batches[currentView]) return;

let batch =
batches[currentView];

let latest =
batch[batch.length-1];

document.getElementById("liveResult")
.innerHTML = latest;

let html = `

<div class="batch">

<div class="batchTitle">

Batch ${currentView+1}

</div>

<div class="numbers">

`;

batch.forEach(n=>{

let border =
getColor(n)=="RED"
? "#ff3b3b"
: "#00c853";

html += `

<div class="num"
style="border:2px solid ${border}">
${n}
</div>

`;

});

html += `

</div>

<button class="arrow"
onclick="nextBatch()">

↓ NEXT BATCH

</button>

</div>

`;

box.innerHTML = html;

}

function nextBatch(){

currentView++;

if(currentView >= batches.length){

currentView = 0;

}

renderCurrent();

}

fetchData();

setInterval(fetchData,60000);

</script>

</body>
</html>
