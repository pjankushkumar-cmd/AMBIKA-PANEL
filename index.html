<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII REAL AI ANALYZER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:38px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.green{
color:#00ff66;
font-weight:bold;
}

.red{
color:#ff4b4b;
font-weight:bold;
}

.violet{
color:#ff4dff;
font-weight:bold;
}

.big{
color:#00c8ff;
font-weight:bold;
}

.small{
color:#ffd000;
font-weight:bold;
}

.ai{
text-align:center;
}

.predict{
font-size:42px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:70px;
font-weight:bold;
margin-top:10px;
color:#00ff99;
}

.conf{
font-size:24px;
margin-top:10px;
}

.status{
margin-top:15px;
font-size:20px;
}

.bar{
width:100%;
height:10px;
background:#222;
border-radius:50px;
margin-top:15px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.footer{
text-align:center;
margin-top:20px;
opacity:.6;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII REAL AI</h1>
<p>REAL PATTERN DETECTION ENGINE</p>
</div>

<div class="card ai">

<h2>NEXT ANALYSIS</h2>

<div class="predict" id="predict">
ANALYZING...
</div>

<div class="number" id="number">
--
</div>

<div class="conf" id="conf">
Confidence : 0%
</div>

<div class="status" id="status">
READING PATTERN...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<div class="card">

<h2>LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII PATTERN AI
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

async function load(){

try{

const res = await fetch(API);

const data = await res.json();

const list = data.data.list || data.data || [];

showHistory(list);

realAnalyze(list);

}catch(err){

document.getElementById("predict").innerHTML =
"API ERROR";

}

}

function showHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,10).forEach(item=>{

let num = Number(item.number);

let bs = num >= 5 ? "BIG" : "SMALL";

let color = "green";

if([2,4,6,8].includes(num)){
color = "red";
}

if(num == 0 || num == 5){
color = "violet";
}

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${color}">
${num}
</div>

<div class="${bs=="BIG"?"big":"small"}">
${bs}
</div>

</div>

`;

});

}

function realAnalyze(list){

let nums = [];

list.slice(0,10).forEach(item=>{

nums.push(Number(item.number));

});

let transitions = {};
let repeats = {};
let movementScore = {};

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(!transitions[current]){
transitions[current] = {};
}

if(!transitions[current][next]){
transitions[current][next] = 0;
}

transitions[current][next]++;

}

nums.forEach(n=>{

repeats[n] = (repeats[n] || 0)+1;

});

for(let n=0;n<=9;n++){

movementScore[n] = 0;

for(let i=0;i<nums.length;i++){

let diff = Math.abs(nums[i]-n);

movementScore[n] += (10-diff);

}

}

let last = nums[0];

let nextMap = transitions[last] || {};

let predictedNumber = null;
let highest = -1;

Object.keys(nextMap).forEach(key=>{

let score = nextMap[key];

score += movementScore[key] || 0;

score -= (repeats[key] || 0)*2;

if(score > highest){

highest = score;
predictedNumber = Number(key);

}

});

if(predictedNumber == null){

predictedNumber =
Object.keys(movementScore).reduce((a,b)=>
movementScore[a] > movementScore[b] ? a : b
);

}

predictedNumber = Number(predictedNumber);

let type =
predictedNumber >=5
? "🔥 BIG"
: "🟢 SMALL";

let confidence = 65;

if(repeats[predictedNumber]){
confidence += 5;
}

if(nextMap[predictedNumber]){
confidence += nextMap[predictedNumber]*8;
}

if(movementScore[predictedNumber] > 60){
confidence += 10;
}

if(confidence > 97){
confidence = 97;
}

let trend = "";

if(confidence >= 90){

trend = "ULTRA AI DETECTED";

}else if(confidence >= 80){

trend = "STRONG PATTERN";

}else{

trend = "NORMAL TREND";

}

document.getElementById("predict").innerHTML =
type;

document.getElementById("number").innerHTML =
predictedNumber;

document.getElementById("conf").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("status").innerHTML =
trend;

document.getElementById("fill").style.width =
confidence+"%";

}

load();

setInterval(load,3000);

</script>

</body>
</html>
