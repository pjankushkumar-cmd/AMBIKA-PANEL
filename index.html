<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ADVANCED AI ANALYZER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#16153c;
padding:15px;
color:white;
}

.mainBox{
background:#221f67;
border-radius:28px;
padding:20px;
margin-bottom:20px;
}

.title{
text-align:center;
font-size:58px;
font-weight:bold;
line-height:1.1;
color:#b689ff;
margin-bottom:30px;
}

.predictBox{
background:#342f8f;
border-radius:22px;
padding:25px;
text-align:center;
}

.predictTitle{
font-size:22px;
margin-bottom:12px;
color:#e5e5ff;
}

.period{
font-size:22px;
margin-bottom:20px;
word-break:break-all;
}

.predictNum{
font-size:95px;
font-weight:bold;
margin-bottom:15px;
}

.aiText{
font-size:22px;
line-height:1.4;
color:#ffd76a;
margin-top:10px;
}

.timerBox{
margin-top:25px;
}

.serverTime{
font-size:36px;
font-weight:bold;
color:#00ffd5;
margin-top:10px;
}

.countdown{
font-size:65px;
font-weight:bold;
color:#ffd76a;
margin-top:10px;
}

.tableBox{
background:#221f67;
border-radius:28px;
overflow:hidden;
}

.header{
background:#4b4598;
display:grid;
grid-template-columns:2.2fr 1fr 1fr 1fr;
padding:20px;
font-size:20px;
font-weight:bold;
}

.row{
display:grid;
grid-template-columns:2.2fr 1fr 1fr 1fr;
padding:20px;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.periodText{
font-size:17px;
word-break:break-all;
}

.number{
font-size:68px;
font-weight:bold;
text-align:center;
}

.bs{
font-size:22px;
text-align:center;
}

.colorWrap{
display:flex;
justify-content:center;
gap:10px;
}

.dot{
width:18px;
height:18px;
border-radius:50%;
}

.red{
background:#ff4b4b;
}

.green{
background:#00d26a;
}

.violet{
background:#ff4dff;
}

.pagination{
background:#221f67;
margin-top:20px;
border-radius:28px;
padding:25px;
display:flex;
justify-content:center;
align-items:center;
gap:30px;
}

.btn{
width:80px;
height:80px;
border:none;
border-radius:18px;
background:#8f7dff;
color:white;
font-size:45px;
cursor:pointer;
}

.page{
font-size:34px;
}

.greenText{
color:#00ff9d;
}

.redText{
color:#ff5c5c;
}

.violetText{
color:#ff5cff;
}

</style>

</head>

<body>

<div class="mainBox">

<div class="title">
ADVANCED AI<br>
ANALYZER
</div>

<div class="predictBox">

<div class="predictTitle">
UPCOMING PERIOD
</div>

<div class="period"
id="upcomingPeriod">

Loading...

</div>

<div class="predictNum"
id="predictNum">

--

</div>

<div class="aiText"
id="aiText">

AI ANALYZING LIVE TREND...

</div>

<div class="timerBox">

<div style="font-size:22px;">
SERVER TIME
</div>

<div class="serverTime"
id="serverTime">

00:00:00

</div>

<div style="
margin-top:20px;
font-size:22px;">

NEXT REFRESH IN

</div>

<div class="countdown"
id="countdown">

60s

</div>

</div>

</div>

</div>

<div class="tableBox">

<div class="header">

<div>Period</div>

<div style="text-align:center;">
Number
</div>

<div style="text-align:center;">
Big Small
</div>

<div style="text-align:center;">
Color
</div>

</div>

<div id="historyRows"></div>

</div>

<div class="pagination">

<button class="btn"
onclick="prevPage()">
‹
</button>

<div class="page"
id="pageNo">

1/50

</div>

<button class="btn"
onclick="nextPage()">
›
</button>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let allHistory = [];

let batches = [];

let currentPage = 0;

let countdown = 60;

/* =========================
   BIG SMALL
========================= */

function getBigSmall(n){

return n <= 4
? "Small"
: "Big";

}

/* =========================
   COLOR
========================= */

function getColor(n){

if([0,2,4,6,8].includes(n)){

return "red";

}

return "green";

}

/* =========================
   NUMBER COLOR
========================= */

function getNumberClass(n){

if([0,2,4,6,8].includes(n)){

return "redText";

}

return "greenText";

}

/* =========================
   MAKE BATCHES
========================= */

function makeBatches(data){

let temp = [];

for(let i=0;i<data.length;i+=10){

temp.push(
data.slice(i,i+10)
);

}

while(temp.length > 50){

temp.shift();

}

batches = temp;

}

/* =========================
   ADVANCED AI
========================= */

function advancedAI(){

let nums =
allHistory.map(x=>x.number);

let score = {};

for(let i=0;i<=9;i++){

score[i]=0;

}

let weight = 1;

for(let i=nums.length-1;i>=1;i--){

let current = nums[i];

let prev = nums[i-1];

score[current] += weight;

if(current === prev){

score[current] += 5;

}

if(getBigSmall(current)
=== getBigSmall(prev)){

score[current] += 2.5;

}

if(getColor(current)
=== getColor(prev)){

score[current] += 2.5;

}

weight += 0.1;

}

let best = 0;

let high = 0;

for(let n in score){

if(score[n] > high){

high = score[n];

best = Number(n);

}

}

let total =
Object.values(score)
.reduce((a,b)=>a+b,0);

let conf =
Math.min(
95,
((high/total)*100+50)
).toFixed(1);

document.getElementById(
"predictNum"
).innerHTML = best;

document.getElementById(
"predictNum"
).className =

`predictNum ${getNumberClass(best)}`;

document.getElementById(
"aiText"
).innerHTML =

`AI DETECT:
${getBigSmall(best)}
 •
${getColor(best).toUpperCase()}
 •
${conf}% Confidence`;

}

/* =========================
   RENDER PAGE
========================= */

function renderPage(){

const box =
document.getElementById(
"historyRows"
);

box.innerHTML = "";

if(!batches[currentPage]) return;

let batch =
batches[currentPage];

batch.forEach(item=>{

let numberClass =
getNumberClass(item.number);

let dots = "";

if(item.number == 5){

dots = `
<div class="dot green"></div>
<div class="dot violet"></div>
`;

}else{

dots = `
<div class="dot ${getColor(item.number)}"></div>
`;

}

box.innerHTML += `

<div class="row">

<div class="periodText">

${item.issueNumber}

</div>

<div class="number ${numberClass}">

${item.number}

</div>

<div class="bs">

${getBigSmall(item.number)}

</div>

<div class="colorWrap">

${dots}

</div>

</div>

`;

});

document.getElementById(
"pageNo"
).innerHTML =

`${currentPage+1}/50`;

}

/* =========================
   NEXT PAGE
========================= */

function nextPage(){

currentPage++;

if(currentPage >= batches.length){

currentPage = 0;

}

renderPage();

}

/* =========================
   PREV PAGE
========================= */

function prevPage(){

currentPage--;

if(currentPage < 0){

currentPage =
batches.length-1;

}

renderPage();

}

/* =========================
   SERVER CLOCK
========================= */

function startClock(){

setInterval(()=>{

let now = new Date();

let h =
String(now.getHours())
.padStart(2,"0");

let m =
String(now.getMinutes())
.padStart(2,"0");

let s =
String(now.getSeconds())
.padStart(2,"0");

document.getElementById(
"serverTime"
).innerHTML =

`${h}:${m}:${s}`;

},1000);

}

/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

setInterval(()=>{

countdown--;

if(countdown <= 0){

countdown = 60;

loadData();

}

document.getElementById(
"countdown"
).innerHTML =

countdown + "s";

},1000);

}

/* =========================
   LOAD DATA
========================= */

async function loadData(){

try{

const res =
await fetch(
API + "?t=" + Date.now()
);

const data =
await res.json();

let list =
data.data.list || [];

allHistory =
list.map(x=>({

issueNumber:
x.issueNumber,

number:
Number(x.number)

}));

makeBatches(allHistory);

renderPage();

advancedAI();

let latest =
allHistory[0]
?.issueNumber || 0;

document.getElementById(
"upcomingPeriod"
).innerHTML =

String(
Number(latest)+1
);

}catch(e){

console.log(e);

}

}

/* =========================
   START
========================= */

startClock();

startCountdown();

loadData();

</script>

</body>
</html>
