<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII LIVE AI PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:40px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.ai{
text-align:center;
}

.predict{
font-size:50px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:90px;
font-weight:bold;
margin-top:10px;
}

.conf{
font-size:25px;
margin-top:10px;
}

.status{
margin-top:15px;
font-size:22px;
}

.bar{
width:100%;
height:10px;
background:#222;
border-radius:50px;
margin-top:15px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:15px;
border-radius:15px;
font-size:17px;
line-height:30px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.green{
color:#00ff66;
font-weight:bold;
}

.red{
color:#ff4545;
font-weight:bold;
}

.violet{
color:#ff4dff;
font-weight:bold;
}

.big{
color:#ff4545;
font-weight:bold;
}

.small{
color:#00ff66;
font-weight:bold;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII LIVE AI PRO</h1>
<p>REAL TIME ADVANCED PATTERN ANALYSIS</p>
</div>

<div class="card ai">

<h2>NEXT LIVE ANALYSIS</h2>

<div class="predict" id="predict">
ANALYZING...
</div>

<div class="number" id="number">
--
</div>

<div class="conf" id="conf">
Confidence : 0%
</div>

<div class="status" id="status">
READING LIVE PATTERN...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading AI...
</div>

</div>

<div class="card">

<h2>LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII AI ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

async function load(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runAI(list);

}catch(err){

document.getElementById("predict").innerHTML =
"API ERROR";

}

}

function renderHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,15).forEach(item=>{

let num = Number(item.number);

let type = num >= 5 ? "BIG" : "SMALL";

let color = "green";

if([6,7,8,9].includes(num)){
color = "red";
}

if(num == 0 || num == 5){
color = "violet";
}

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${color}">
${num}
</div>

<div class="${type=="BIG"?"big":"small"}">
${type}
</div>

</div>

`;

});

}

function runAI(list){

let nums = [];
let bs = [];

list.slice(0,15).forEach(item=>{

let n = Number(item.number);

nums.push(n);

bs.push(n>=5 ? "B":"S");

});

let last = nums[0];

let transitions = {};

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(!transitions[current]){
transitions[current] = {};
}

if(!transitions[current][next]){
transitions[current][next] = 0;
}

transitions[current][next]++;

}

let heatMap = {};

for(let n=0;n<=9;n++){

heatMap[n] = 0;

nums.forEach(v=>{

let diff = Math.abs(v-n);

heatMap[n] += (10-diff);

});

if(nums.includes(n)){
heatMap[n] -= 5;
}

}

if(transitions[last]){

Object.keys(transitions[last]).forEach(k=>{

heatMap[k] += transitions[last][k]*18;

});

}

let nextNumber = Number(
Object.keys(heatMap).reduce((a,b)=>
heatMap[a] > heatMap[b] ? a : b
));

let nextType =
nextNumber >=5
? "🔴 BIG"
: "🟢 SMALL";

let confidence = 70;

let bigCount =
nums.filter(n=>n>=5).length;

let smallCount =
nums.filter(n=>n<5).length;

if(nextNumber>=5 && bigCount>smallCount){
confidence += 8;
}

if(nextNumber<5 && smallCount>bigCount){
confidence += 8;
}

if(Math.abs(last-nextNumber)<=2){
confidence += 6;
}

if(transitions[last] &&
transitions[last][nextNumber]){
confidence +=
transitions[last][nextNumber]*5;
}

let repeat = 0;
let switchs = 0;

for(let i=0;i<bs.length-1;i++){

if(bs[i]==bs[i+1]){
repeat++;
}else{
switchs++;
}

}

if(repeat>switchs){
confidence += 5;
}

if(confidence>98){
confidence = 98;
}

let signal = "";

if(confidence>=92){

signal = "ULTRA HIGH AI SIGNAL";

}else if(confidence>=82){

signal = "STRONG LIVE SIGNAL";

}else{

signal = "NORMAL PATTERN";

}

document.getElementById("predict").innerHTML =
nextType;

document.getElementById("number").innerHTML =
nextNumber;

document.getElementById("number").style.color =
nextNumber>=5
? "#ff4545"
: "#00ff66";

document.getElementById("conf").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("status").innerHTML =
signal;

document.getElementById("fill").style.width =
confidence+"%";

document.getElementById("analysis").innerHTML = `

<b>Pattern:</b>
${bs.join(" → ")}<br><br>

<b>BIG Count:</b> ${bigCount}<br>
<b>SMALL Count:</b> ${smallCount}<br><br>

<b>Last Number:</b> ${last}<br>
<b>Predicted Number:</b> ${nextNumber}<br><br>

<b>Live AI Analysis:</b><br>
• Transition Pattern Scan<br>
• BIG/SMALL Pressure Reading<br>
• Repeat Cycle Detection<br>
• Heatmap Number Analysis<br>
• Live Momentum Tracking<br>
• Adaptive Confidence Engine

`;

}

load();

setInterval(load,2500);

</script>

</body>
</html>
