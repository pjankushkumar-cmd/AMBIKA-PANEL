<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKII REAL AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:40px;
color:#00ff99;
}

.title p{
opacity:.7;
margin-top:5px;
}

.card{
background:#101935;
padding:18px;
border-radius:18px;
margin-top:18px;
box-shadow:0 0 20px #000;
}

.ai{
text-align:center;
}

.predict{
font-size:50px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:90px;
font-weight:bold;
margin-top:10px;
}

.conf{
font-size:25px;
margin-top:10px;
}

.status{
margin-top:15px;
font-size:22px;
}

.bar{
width:100%;
height:10px;
background:#222;
border-radius:50px;
margin-top:15px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00ff99;
transition:1s;
}

.analysis{
margin-top:20px;
background:#182447;
padding:15px;
border-radius:15px;
font-size:17px;
line-height:30px;
text-align:left;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#182447;
border-radius:12px;
margin-top:10px;
}

.red{
color:#ff4545;
font-weight:bold;
}

.green{
color:#00ff66;
font-weight:bold;
}

.violet{
color:#ff4dff;
font-weight:bold;
}

.footer{
text-align:center;
opacity:.6;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🤖 HACKII REAL AI</h1>
<p>REAL PATTERN + COLOR ANALYSIS</p>
</div>

<div class="card ai">

<h2>NEXT LIVE ANALYSIS</h2>

<div class="predict" id="predict">
ANALYZING...
</div>

<div class="number" id="number">
--
</div>

<div class="conf" id="conf">
Confidence : 0%
</div>

<div class="status" id="status">
SCANNING LIVE DATA...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="analysis" id="analysis">
Loading Analysis...
</div>

</div>

<div class="card">

<h2>LIVE HISTORY</h2>

<div id="history"></div>

</div>

<div class="footer">
POWERED BY HACKII AI ENGINE
</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

async function load(){

try{

const res = await fetch(API);

const json = await res.json();

const list = json.data.list || json.data || [];

renderHistory(list);

runAI(list);

}catch(err){

document.getElementById("predict").innerHTML =
"API ERROR";

}

}

function getColor(num){

if([0,2,4,6,8].includes(num)){
return "RED";
}

if([1,3,5,7,9].includes(num)){
return "GREEN";
}

return "VIOLET";

}

function renderHistory(list){

document.getElementById("history").innerHTML = "";

list.slice(0,15).forEach(item=>{

let num = Number(item.number);

let type = num >=5 ? "BIG" : "SMALL";

let color = getColor(num);

let cls = "green";

if(color=="RED"){
cls="red";
}

if(color=="VIOLET"){
cls="violet";
}

document.getElementById("history").innerHTML += `

<div class="row">

<div>${item.issueNumber}</div>

<div class="${cls}">
${num}
</div>

<div class="${cls}">
${color}
</div>

<div class="${type=="BIG"?"red":"green"}">
${type}
</div>

</div>

`;

});

}

function runAI(list){

let nums = [];
let bs = [];
let colors = [];

list.slice(0,15).forEach(item=>{

let n = Number(item.number);

nums.push(n);

bs.push(n>=5 ? "B":"S");

colors.push(getColor(n));

});

let last = nums[0];

let scores = {};

for(let i=0;i<=9;i++){

scores[i]=0;

}

for(let i=0;i<nums.length;i++){

let current = nums[i];

for(let n=0;n<=9;n++){

let diff = Math.abs(current-n);

scores[n] += (10-diff);

}

}

for(let i=0;i<nums.length-1;i++){

let current = nums[i+1];
let next = nums[i];

if(Math.abs(current-next)<=2){

scores[next]+=15;

}

if(current%2 == next%2){

scores[next]+=10;

}

if(
(current>=5 && next>=5) ||
(current<5 && next<5)
){

scores[next]+=12;

}

}

nums.forEach(n=>{

scores[n]-=8;

});

let predicted = Number(
Object.keys(scores).reduce((a,b)=>
scores[a] > scores[b] ? a : b
));

let nextType =
predicted>=5
? "🔴 BIG"
: "🟢 SMALL";

let color = getColor(predicted);

let colorClass =
color=="RED"
? "red"
: "green";

let confidence = 72;

let bigCount =
nums.filter(n=>n>=5).length;

let smallCount =
nums.filter(n=>n<5).length;

if(predicted>=5 && bigCount>smallCount){
confidence+=8;
}

if(predicted<5 && smallCount>bigCount){
confidence+=8;
}

let redCount =
colors.filter(c=>c=="RED").length;

let greenCount =
colors.filter(c=>c=="GREEN").length;

if(color=="RED" && redCount>greenCount){
confidence+=5;
}

if(color=="GREEN" && greenCount>redCount){
confidence+=5;
}

if(Math.abs(last-predicted)<=2){
confidence+=5;
}

if(confidence>98){
confidence=98;
}

let signal="NORMAL SIGNAL";

if(confidence>=90){
signal="ULTRA AI SIGNAL";
}else if(confidence>=80){
signal="STRONG LIVE SIGNAL";
}

document.getElementById("predict").innerHTML =
nextType;

document.getElementById("number").innerHTML =
predicted;

document.getElementById("number").className =
colorClass;

document.getElementById("conf").innerHTML =
"Confidence : "+confidence+"%";

document.getElementById("status").innerHTML =
signal;

document.getElementById("fill").style.width =
confidence+"%";

document.getElementById("analysis").innerHTML = `

<b>BIG/SMALL Pattern:</b><br>
${bs.join(" → ")}<br><br>

<b>Color Pattern:</b><br>
${colors.join(" → ")}<br><br>

<b>Predicted Number:</b> ${predicted}<br>
<b>Predicted Color:</b>
<span class="${colorClass}">
${color}
</span><br>

<b>AI Logic:</b><br>
• Number Heatmap Analysis<br>
• Color Momentum Detection<br>
• BIG/SMALL Pressure Scan<br>
• Repeat Cycle Reading<br>
• Distance Pattern Engine<br>
• Odd/Even Matching System

`;

}

load();

setInterval(load,2500);

</script>

</body>
</html>
